/* ==========================================================================
   小满账本 · 界面样式
   ========================================================================== */

:root {
  color-scheme: light;
  --bg: #f4f1e9;
  --bg-deep: #ebe6da;
  --paper: #fffdf8;
  --paper-white: #ffffff;
  --ink: #1a2a23;
  --ink-soft: #405048;
  --muted: #758078;
  --faint: #9ba39b;
  --line: #e7e1d4;
  --line-strong: #d8d1c0;
  --green: #235c48;
  --green-deep: #173f32;
  --green-bright: #3c7d6a;
  --green-soft: #e7efe8;
  --green-pale: #f0f5ef;
  --orange: #df783f;
  --orange-deep: #b95828;
  --orange-soft: #fbeade;
  --red: #b64b43;
  --red-soft: #f8e8e4;
  --gold: #d3a04a;
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --shadow-card: 0 10px 36px rgba(32, 47, 38, 0.045);
  --shadow-float: 0 22px 70px rgba(20, 40, 30, 0.18);
  --font-sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-number: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
  --ease: cubic-bezier(0.22, 0.8, 0.28, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

@media (min-width: 961px) {
  html {
    scrollbar-gutter: stable;
  }
}

body {
  min-width: 320px;
  min-height: 100dvh;
  margin: 0;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.55;
  background:
    radial-gradient(1000px 680px at 105% -8%, rgba(223, 120, 63, 0.075), transparent 58%),
    radial-gradient(900px 600px at -8% 108%, rgba(35, 92, 72, 0.07), transparent 58%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body.is-locked {
  overflow: hidden;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

svg {
  display: block;
}

[hidden] {
  display: none !important;
}

::selection {
  color: var(--green-deep);
  background: #d8e7db;
}

:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 3px;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.skip-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 200;
  padding: 10px 14px;
  color: #fff;
  background: var(--green-deep);
  border-radius: 10px;
  transform: translateY(-150%);
  transition: transform 0.2s ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.icon {
  display: block;
  flex: none;
}

/* ==========================================================================
   应用骨架与侧栏
   ========================================================================== */

.app-shell {
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
  min-height: 100dvh;
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding: 28px 20px 22px;
  overflow-y: auto;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.42), transparent 44%),
    rgba(235, 230, 219, 0.78);
  border-right: 1px solid rgba(190, 181, 163, 0.35);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  width: fit-content;
  padding: 2px 6px 2px 2px;
  border-radius: 14px;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 43px;
  height: 43px;
  color: #f8f1df;
  font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  background:
    radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.2), transparent 42%),
    var(--green-deep);
  border-radius: 14px 14px 17px 11px;
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.14),
    0 8px 20px rgba(23, 63, 50, 0.16);
  transform: rotate(-2deg);
}

.brand-mark-small {
  width: 33px;
  height: 33px;
  font-size: 17px;
  border-radius: 10px 10px 12px 8px;
}

.brand-copy {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand-copy strong {
  color: var(--green-deep);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.brand-copy small {
  margin-top: 5px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.16em;
}

.side-nav {
  display: grid;
  gap: 6px;
  margin-top: 42px;
}

.nav-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 0 14px;
  color: var(--ink-soft);
  font-size: 14px;
  font-weight: 500;
  border-radius: 14px;
  transition:
    color 0.2s ease,
    background 0.2s ease,
    transform 0.2s ease;
}

.nav-icon {
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: color 0.2s ease;
}

.nav-link:hover {
  color: var(--green-deep);
  background: rgba(255, 253, 248, 0.6);
}

.nav-link.active {
  color: var(--green-deep);
  font-weight: 650;
  background: var(--paper);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.8) inset,
    0 8px 24px rgba(40, 48, 39, 0.06);
}

.nav-link.active .nav-icon {
  color: var(--orange);
}

.nav-link.active::after {
  content: "";
  position: absolute;
  top: 50%;
  right: 14px;
  width: 5px;
  height: 5px;
  background: var(--orange);
  border-radius: 50%;
  transform: translateY(-50%);
}

.side-bottom {
  display: grid;
  gap: 14px;
  margin-top: auto;
  padding-top: 36px;
}

.local-note {
  display: flex;
  gap: 10px;
  padding: 14px;
  background: rgba(255, 253, 248, 0.52);
  border: 1px solid rgba(217, 208, 190, 0.6);
  border-radius: 16px;
}

.local-note-icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: none;
  color: var(--green);
  background: rgba(35, 92, 72, 0.09);
  border-radius: 9px;
}

.local-note strong {
  display: block;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 650;
}

.local-note p {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.55;
}

.side-add {
  justify-content: flex-start;
  width: 100%;
  height: 48px;
  padding: 0 15px;
  font-size: 14px;
}

.side-add kbd {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  margin-left: auto;
  color: rgba(255, 255, 255, 0.6);
  font-family: var(--font-sans);
  font-size: 10px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 6px;
}

.side-version {
  color: var(--faint);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-align: center;
}

.main {
  min-width: 0;
}

.view-root {
  width: min(1180px, 100%);
  min-height: 100dvh;
  padding: 42px clamp(28px, 4vw, 64px) 86px;
  margin: 0 auto;
}

.view {
  animation: view-in 0.42s var(--ease) both;
}

.mobile-topbar,
.mobile-nav {
  display: none;
}

/* ==========================================================================
   通用按钮、标题与面板
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 17px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  border: 1px solid transparent;
  border-radius: 12px;
  transition:
    transform 0.18s var(--ease),
    background 0.18s ease,
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  color: #fbf8ee;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 46%),
    var(--green-deep);
  border-color: var(--green-deep);
  box-shadow: 0 10px 24px rgba(23, 63, 50, 0.16);
}

.btn-primary:hover {
  background-color: #1d4c3c;
  box-shadow: 0 13px 28px rgba(23, 63, 50, 0.21);
}

.btn-secondary {
  color: var(--ink-soft);
  background: var(--paper);
  border-color: var(--line-strong);
}

.btn-secondary:hover {
  color: var(--green-deep);
  background: var(--paper-white);
  border-color: #bdb5a2;
}

.btn-ghost {
  min-height: 36px;
  padding: 0 12px;
  color: var(--muted);
  background: transparent;
  border-color: transparent;
}

.btn-ghost:hover {
  color: var(--green-deep);
  background: rgba(255, 253, 248, 0.7);
}

.btn-danger {
  color: #fff;
  background: var(--red);
  border-color: var(--red);
}

.btn-sm {
  min-height: 34px;
  padding: 0 12px;
  font-size: 12px;
  border-radius: 10px;
}

.icon-button {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  color: var(--ink-soft);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 11px;
  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    transform 0.18s var(--ease);
}

.icon-button:hover {
  color: var(--green-deep);
  background: var(--paper-white);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.icon-button.is-danger:hover {
  color: var(--red);
  background: var(--red-soft);
  border-color: #edc9c3;
}

.text-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--green);
  font-size: 12.5px;
  font-weight: 600;
}

.text-button:hover {
  color: var(--orange-deep);
}

.text-button.is-danger {
  color: var(--red);
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 26px;
  margin-bottom: 28px;
}

.page-head-copy {
  min-width: 0;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
}

.eyebrow-dot {
  width: 5px;
  height: 5px;
  background: var(--orange);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(223, 120, 63, 0.1);
}

.page-head h1 {
  color: var(--ink);
  font-size: clamp(27px, 2.8vw, 34px);
  font-weight: 700;
  line-height: 1.26;
  letter-spacing: -0.035em;
}

.page-subtitle {
  max-width: 560px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: none;
}

.panel {
  min-width: 0;
  padding: 22px 24px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.panel-title {
  min-width: 0;
}

.panel-title h2 {
  color: var(--ink);
  font-size: 15.5px;
  font-weight: 650;
  line-height: 1.35;
  letter-spacing: -0.01em;
}

.panel-title p {
  margin-top: 4px;
  color: var(--faint);
  font-size: 11px;
}

.panel-link {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex: none;
  color: var(--green);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.panel-link:hover {
  color: var(--orange-deep);
}

/* ==========================================================================
   总览
   ========================================================================== */

.balance-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 36px;
  align-items: end;
  min-height: 218px;
  padding: 32px 36px;
  overflow: hidden;
  color: #faf5e9;
  background:
    radial-gradient(110% 160% at 96% 110%, rgba(223, 120, 63, 0.26), transparent 58%),
    linear-gradient(132deg, #1d4b3c 0%, #173f32 56%, #12382c 100%);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--radius-xl);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.12),
    0 24px 60px rgba(23, 63, 50, 0.17);
  isolation: isolate;
}

.balance-card::before {
  content: "";
  position: absolute;
  top: -188px;
  right: -134px;
  z-index: -1;
  width: 420px;
  height: 420px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  box-shadow:
    0 0 0 44px rgba(255, 255, 255, 0.025),
    0 0 0 98px rgba(255, 255, 255, 0.018);
}

.balance-card::after {
  content: "";
  position: absolute;
  right: 13%;
  bottom: -66px;
  z-index: -1;
  width: 130px;
  height: 130px;
  background: radial-gradient(circle at 36% 32%, rgba(255, 221, 169, 0.3), rgba(223, 120, 63, 0.07) 64%, transparent 70%);
  border-radius: 50%;
  filter: blur(1px);
}

.balance-main,
.balance-side {
  position: relative;
  z-index: 1;
}

.balance-label {
  display: flex;
  align-items: center;
  gap: 9px;
  color: rgba(250, 245, 233, 0.66);
  font-size: 11.5px;
  letter-spacing: 0.12em;
}

.balance-label::before {
  content: "";
  width: 22px;
  height: 1px;
  background: rgba(250, 245, 233, 0.34);
}

.balance-amount {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 13px 0 17px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.035em;
}

.balance-amount .currency {
  align-self: flex-start;
  margin-top: 8px;
  color: rgba(250, 245, 233, 0.58);
  font-family: var(--font-number);
  font-size: 25px;
  font-weight: 400;
}

.balance-amount .number {
  font-family: var(--font-number);
  font-size: clamp(49px, 5.2vw, 69px);
  font-weight: 500;
  line-height: 0.95;
}

.balance-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  color: rgba(250, 245, 233, 0.66);
  font-size: 11.5px;
}

.trend-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  color: #f4b990;
  font-size: 10.5px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.085);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 999px;
}

.trend-chip.is-down {
  color: #a9d4bc;
}

.trend-chip.is-flat {
  color: rgba(250, 245, 233, 0.62);
}

.balance-side {
  display: grid;
  gap: 5px;
  min-width: 168px;
  padding: 0 2px 2px 30px;
  border-left: 1px solid rgba(255, 255, 255, 0.14);
}

.balance-side-label {
  color: rgba(250, 245, 233, 0.55);
  font-size: 10.5px;
  letter-spacing: 0.12em;
}

.balance-side-value {
  color: #fffaf0;
  font-family: var(--font-number);
  font-size: 27px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.balance-side-note {
  color: rgba(250, 245, 233, 0.5);
  font-size: 10.5px;
}

.summary-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.summary-card {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
  padding: 17px 18px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
}

.summary-icon {
  display: grid;
  place-items: center;
  width: 39px;
  height: 39px;
  flex: none;
  color: var(--green);
  background: var(--green-pale);
  border-radius: 12px;
}

.summary-card:nth-child(2) .summary-icon {
  color: #9b792f;
  background: #faf2df;
}

.summary-card:nth-child(3) .summary-icon {
  color: var(--orange-deep);
  background: var(--orange-soft);
}

.summary-copy {
  min-width: 0;
}

.summary-label {
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.04em;
}

.summary-value {
  margin-top: 1px;
  color: var(--ink);
  font-size: 19px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
  white-space: nowrap;
}

.summary-value small {
  margin-left: 2px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 500;
}

.quick-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 17px 1px 3px;
  overflow-x: auto;
  scrollbar-width: none;
}

.quick-strip::-webkit-scrollbar {
  display: none;
}

.quick-label {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  padding-right: 4px;
  color: var(--faint);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.quick-label .icon {
  color: var(--orange);
}

.quick-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  height: 32px;
  padding: 0 11px;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 500;
  background: rgba(255, 253, 248, 0.66);
  border: 1px solid var(--line);
  border-radius: 999px;
  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease,
    transform 0.18s var(--ease);
}

.quick-chip .icon {
  color: var(--cat);
}

.quick-chip:hover {
  color: var(--green-deep);
  background: var(--paper);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.overview-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
  gap: 16px;
  margin-top: 15px;
}

/* 近七日柱状图 */

.bar-chart-frame {
  position: relative;
  padding-top: 19px;
  margin-top: 3px;
}

.bar-chart-frame::before {
  content: "";
  position: absolute;
  top: 19px;
  right: 0;
  left: 0;
  height: 142px;
  pointer-events: none;
  background: repeating-linear-gradient(
    to top,
    transparent 0,
    transparent 46.3px,
    rgba(216, 209, 192, 0.44) 46.3px,
    rgba(216, 209, 192, 0.44) 47.3px
  );
}

.bar-chart {
  position: relative;
  z-index: 1;
  display: flex;
  gap: clamp(7px, 2.6vw, 22px);
  align-items: flex-end;
}

.bar-column {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.bar-plot {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  height: 142px;
}

.bar {
  position: relative;
  width: min(30px, 74%);
  height: var(--bar-height, 2px);
  min-height: 2px;
  background: linear-gradient(180deg, #80a994 0%, #3c7d6a 100%);
  border-radius: 9px 9px 4px 4px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32);
  transition:
    height 0.5s var(--ease),
    filter 0.18s ease,
    transform 0.18s var(--ease);
  animation: bar-grow 0.6s var(--ease) both;
  transform-origin: bottom;
}

.bar.is-today {
  background: linear-gradient(180deg, #efa87d 0%, #df783f 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.4),
    0 6px 16px rgba(223, 120, 63, 0.22);
}

.bar.is-empty {
  background: #e5dfd2;
  box-shadow: none;
}

.bar-column:hover .bar {
  filter: saturate(1.1) brightness(1.03);
  transform: scaleX(1.06);
}

.bar-value {
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  z-index: 3;
  padding: 4px 7px;
  color: #fbf8ee;
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  pointer-events: none;
  background: var(--green-deep);
  border-radius: 6px;
  opacity: 0;
  transform: translate(-50%, 3px);
  transition:
    opacity 0.16s ease,
    transform 0.16s ease;
}

.bar-column:hover .bar-value,
.bar-column:focus-within .bar-value {
  opacity: 1;
  transform: translate(-50%, 0);
}

.bar-label {
  display: grid;
  gap: 1px;
  justify-items: center;
  margin-top: 10px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.3;
}

.bar-label strong {
  color: var(--ink-soft);
  font-size: 10.5px;
  font-weight: 600;
}

.bar-label.is-today strong {
  color: var(--orange-deep);
}

.bar-label span {
  color: var(--faint);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}

.chart-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
  margin-top: 15px;
  color: var(--muted);
  font-size: 10.5px;
  border-top: 1px solid var(--line);
}

.chart-footer strong {
  color: var(--ink);
  font-size: 12px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

/* 分类环图 */

.donut-layout {
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 182px;
  padding-top: 11px;
}

.donut {
  position: relative;
  display: grid;
  place-items: center;
  width: 130px;
  aspect-ratio: 1;
  flex: none;
  background: var(--segments, #e7e1d4);
  border-radius: 50%;
  transform: rotate(-90deg);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
}

.donut::after {
  content: "";
  position: absolute;
  inset: 18px;
  background:
    radial-gradient(circle at 36% 28%, #ffffff, transparent 56%),
    var(--paper);
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(231, 225, 212, 0.7);
}

.donut-center {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 1px;
  justify-items: center;
  transform: rotate(90deg);
  text-align: center;
}

.donut-center span {
  color: var(--faint);
  font-size: 9px;
  letter-spacing: 0.06em;
}

.donut-center strong {
  max-width: 80px;
  color: var(--green-deep);
  font-size: 15px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  line-height: 1.25;
}

.donut-legend {
  display: grid;
  gap: 9px;
  flex: 1;
  min-width: 0;
}

.legend-row {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) auto;
  gap: 7px;
  align-items: center;
  min-width: 0;
}

.legend-dot {
  width: 7px;
  height: 7px;
  background: var(--cat);
  border-radius: 2px;
  transform: rotate(8deg);
}

.legend-name {
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.legend-value {
  color: var(--muted);
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.legend-more {
  color: var(--faint);
  font-size: 9.5px;
  text-align: right;
}

.empty-mini {
  display: grid;
  place-items: center;
  gap: 8px;
  min-height: 175px;
  padding: 18px 0;
  color: var(--faint);
  text-align: center;
}

.empty-mini .empty-icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  color: #a8b0a7;
  background: var(--green-pale);
  border-radius: 50%;
}

.empty-mini p {
  max-width: 180px;
  font-size: 10.5px;
  line-height: 1.7;
}

/* 最近记录 */

.recent-panel {
  margin-top: 15px;
}

.record-list {
  display: grid;
}

.record-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-width: 0;
  padding: 11px 9px;
  text-align: left;
  border-radius: 13px;
  transition:
    background 0.18s ease,
    transform 0.18s var(--ease);
}

.record-item + .record-item {
  border-top: 1px solid rgba(231, 225, 212, 0.7);
}

.record-item:hover {
  background: #f8f5ed;
  transform: translateX(2px);
}

.record-icon {
  display: grid;
  place-items: center;
  width: 41px;
  height: 41px;
  flex: none;
  color: var(--cat);
  background: color-mix(in srgb, var(--cat) 10%, #fff);
  border: 1px solid color-mix(in srgb, var(--cat) 15%, transparent);
  border-radius: 13px;
}

.record-main {
  display: grid;
  flex: 1;
  gap: 2px;
  min-width: 0;
}

.record-name {
  overflow: hidden;
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.45;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.record-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  overflow: hidden;
  color: var(--faint);
  font-size: 10px;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.record-meta .dot-sep::before {
  content: "·";
  margin-right: 5px;
}

.record-amount {
  flex: none;
  color: var(--ink);
  font-family: var(--font-number);
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.record-arrow {
  flex: none;
  color: #c0c4bd;
  transition: transform 0.18s var(--ease);
}

.record-item:hover .record-arrow {
  color: var(--green);
  transform: translateX(2px);
}

/* ==========================================================================
   空状态与月份切换
   ========================================================================== */

.empty-state {
  display: grid;
  justify-items: center;
  gap: 9px;
  padding: 42px 22px;
  color: var(--muted);
  text-align: center;
}

.empty-state-icon {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  margin-bottom: 3px;
  color: var(--green);
  background: var(--green-pale);
  border: 1px dashed #cbdacb;
  border-radius: 19px;
  transform: rotate(-3deg);
}

.empty-state h2,
.empty-state h3 {
  color: var(--ink);
  font-size: 15px;
  font-weight: 650;
}

.empty-state p {
  max-width: 300px;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.7;
}

.empty-state .btn {
  margin-top: 8px;
}

.month-switch {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: rgba(255, 253, 248, 0.72);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.month-switch button {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  color: var(--ink-soft);
  border-radius: 8px;
  transition:
    color 0.18s ease,
    background 0.18s ease;
}

.month-switch button:hover:not(:disabled) {
  color: var(--green-deep);
  background: var(--green-pale);
}

.month-switch button:disabled {
  color: #c7cac3;
}

.month-switch span {
  min-width: 78px;
  padding: 0 4px;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.month-switch.compact span {
  min-width: 64px;
  font-size: 11px;
}

/* ==========================================================================
   流水页
   ========================================================================== */

.ledger-summary {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 20px;
  margin-bottom: 14px;
  background: linear-gradient(135deg, rgba(231, 239, 232, 0.82), rgba(255, 253, 248, 0.7));
  border: 1px solid #dfe8dd;
  border-radius: var(--radius-md);
}

.ledger-summary-main {
  display: flex;
  align-items: baseline;
  gap: 9px;
}

.ledger-summary-main span {
  color: var(--muted);
  font-size: 11.5px;
}

.ledger-summary-main strong {
  color: var(--green-deep);
  font-family: var(--font-number);
  font-size: 25px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.ledger-summary-meta {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-left: auto;
  color: var(--muted);
  font-size: 10.5px;
}

.ledger-summary-meta span + span {
  padding-left: 11px;
  border-left: 1px solid #d2dfd2;
}

.toolbar {
  display: grid;
  gap: 12px;
  padding: 4px 0 18px;
}

.toolbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 190px;
  max-width: 310px;
}

.search-box > .icon {
  position: absolute;
  top: 50%;
  left: 13px;
  color: var(--faint);
  pointer-events: none;
  transform: translateY(-50%);
}

.search-box input {
  width: 100%;
  height: 41px;
  padding: 0 36px 0 37px;
  color: var(--ink);
  font-size: 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: none;
  transition:
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

.search-box input::placeholder {
  color: #a9afa8;
}

.search-box input::-webkit-search-cancel-button,
.search-box input::-webkit-search-decoration {
  display: none;
  -webkit-appearance: none;
}

.search-box input:focus {
  border-color: #adc4b4;
  box-shadow: 0 0 0 3px rgba(60, 125, 106, 0.09);
}

.search-clear {
  position: absolute;
  top: 50%;
  right: 7px;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  color: var(--faint);
  border-radius: 7px;
  transform: translateY(-50%);
}

.search-clear:hover {
  color: var(--ink);
  background: var(--bg);
}

.filter-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0 3px;
  scrollbar-width: none;
}

.filter-chips::-webkit-scrollbar {
  display: none;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  height: 30px;
  padding: 0 11px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 500;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 999px;
  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
}

.chip:hover {
  color: var(--green-deep);
  background: rgba(255, 253, 248, 0.7);
  border-color: var(--line);
}

.chip.active {
  color: var(--green-deep);
  font-weight: 600;
  background: var(--paper);
  border-color: var(--line-strong);
  box-shadow: 0 3px 10px rgba(35, 45, 36, 0.04);
}

.chip-dot {
  width: 6px;
  height: 6px;
  background: var(--cat);
  border-radius: 50%;
}

.active-filter {
  display: flex;
  align-items: center;
  gap: 5px;
  width: fit-content;
  padding: 5px 7px 5px 10px;
  color: var(--orange-deep);
  font-size: 10.5px;
  font-weight: 600;
  background: var(--orange-soft);
  border: 1px solid #f2d6c1;
  border-radius: 999px;
}

.active-filter button {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  color: var(--orange-deep);
  border-radius: 50%;
}

.active-filter button:hover {
  background: rgba(185, 88, 40, 0.11);
}

.ledger-results {
  display: grid;
  gap: 12px;
}

.day-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.day-header {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 14px 20px 10px;
  background: linear-gradient(180deg, rgba(248, 245, 237, 0.8), rgba(255, 253, 248, 0));
}

.day-date {
  color: var(--ink);
  font-size: 13px;
  font-weight: 650;
}

.day-weekday {
  color: var(--faint);
  font-size: 10px;
}

.day-today {
  padding: 2px 6px;
  color: var(--orange-deep);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  background: var(--orange-soft);
  border-radius: 4px;
}

.day-total {
  margin-left: auto;
  color: var(--muted);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}

.day-total strong {
  margin-left: 3px;
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 650;
}

.day-card .record-list {
  padding: 0 11px 8px;
}

.day-card .record-item {
  padding: 10px 9px;
}

.result-footer {
  padding: 16px 4px 4px;
  color: var(--faint);
  font-size: 10px;
  text-align: center;
}

/* ==========================================================================
   统计页
   ========================================================================== */

.stats-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.stat-tile {
  min-width: 0;
  padding: 18px 19px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
}

.stat-tile.is-accent {
  color: #faf5e9;
  background:
    radial-gradient(130% 160% at 100% 120%, rgba(223, 120, 63, 0.26), transparent 60%),
    var(--green-deep);
  border-color: var(--green-deep);
  box-shadow: 0 16px 34px rgba(23, 63, 50, 0.14);
}

.stat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.03em;
}

.stat-tile.is-accent .stat-label {
  color: rgba(250, 245, 233, 0.6);
}

.stat-label .icon {
  opacity: 0.7;
}

.stat-value {
  margin-top: 6px;
  overflow: hidden;
  color: var(--ink);
  font-family: var(--font-number);
  font-size: clamp(23px, 2.35vw, 29px);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stat-tile.is-accent .stat-value {
  color: #fffaf0;
}

.stat-note {
  margin-top: 5px;
  color: var(--faint);
  font-size: 9.5px;
  line-height: 1.5;
}

.stat-tile.is-accent .stat-note {
  color: rgba(250, 245, 233, 0.45);
}

.stats-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(260px, 1fr);
  gap: 16px;
  align-items: start;
}

.calendar-panel {
  padding-bottom: 18px;
}

.calendar {
  margin-top: 17px;
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  padding: 0 1px 7px;
}

.calendar-weekdays span {
  color: var(--faint);
  font-size: 9px;
  text-align: center;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
}

.calendar-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
  min-height: 64px;
  padding: 7px 8px 6px;
  text-align: left;
  background: #f8f5ed;
  border: 1px solid transparent;
  border-radius: 9px;
  transition:
    transform 0.18s var(--ease),
    border-color 0.18s ease,
    filter 0.18s ease;
}

button.calendar-cell:hover {
  z-index: 2;
  border-color: #b7ccbb;
  filter: brightness(0.99);
  transform: translateY(-2px);
}

.calendar-cell.is-blank {
  min-height: 64px;
  background: transparent;
}

.calendar-cell.is-today {
  box-shadow: inset 0 0 0 1.5px var(--orange);
}

.calendar-cell.level-1 {
  background: #f0f5ef;
}

.calendar-cell.level-2 {
  background: #dce9df;
}

.calendar-cell.level-3 {
  background: #c4dabf;
}

.calendar-cell.level-4 {
  background: #a6c6ae;
}

.cell-day {
  color: var(--muted);
  font-family: var(--font-number);
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.calendar-cell.is-today .cell-day {
  color: var(--orange-deep);
}

.calendar-cell.level-3 .cell-day,
.calendar-cell.level-4 .cell-day {
  color: var(--green-deep);
}

.cell-total {
  overflow: hidden;
  color: var(--green);
  font-size: 9px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.calendar-cell.level-4 .cell-total {
  color: #143e2c;
}

.calendar-legend {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 10px;
  color: var(--faint);
  font-size: 8.5px;
}

.calendar-legend i {
  width: 13px;
  height: 8px;
  background: #f0f5ef;
  border-radius: 2px;
}

.calendar-legend i:nth-of-type(2) {
  background: #dce9df;
}

.calendar-legend i:nth-of-type(3) {
  background: #c4dabf;
}

.calendar-legend i:nth-of-type(4) {
  background: #a6c6ae;
}

.calendar-hint {
  margin-top: 9px;
  color: var(--faint);
  font-size: 9px;
  text-align: right;
}

.insight-panel {
  display: flex;
  flex-direction: column;
}

.insight-list {
  display: grid;
  gap: 0;
  margin-top: 9px;
}

.insight-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 15px 0;
  border-bottom: 1px solid rgba(231, 225, 212, 0.75);
}

.insight-item:last-child {
  border-bottom: 0;
}

.insight-icon {
  display: grid;
  place-items: center;
  width: 33px;
  height: 33px;
  flex: none;
  color: var(--orange-deep);
  background: var(--orange-soft);
  border-radius: 10px;
}

.insight-icon.green {
  color: var(--green);
  background: var(--green-pale);
}

.insight-icon.gold {
  color: #98742a;
  background: #faf1dd;
}

.insight-copy {
  flex: 1;
  min-width: 0;
}

.insight-label {
  color: var(--faint);
  font-size: 9.5px;
}

.insight-value {
  overflow: hidden;
  margin-top: 2px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.insight-extra {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.insight-empty {
  padding: 52px 15px;
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.8;
  text-align: center;
}

.ranking-panel {
  margin-top: 16px;
}

.ranking-list {
  display: grid;
  gap: 3px;
  margin-top: 12px;
}

.ranking-row {
  display: grid;
  grid-template-columns: 19px 35px minmax(0, 1fr) minmax(85px, 0.8fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 5px;
  border-radius: 10px;
  transition: background 0.18s ease;
}

.ranking-row:hover {
  background: #f8f5ed;
}

.ranking-number {
  color: var(--faint);
  font-family: var(--font-number);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.ranking-row:nth-child(-n + 3) .ranking-number {
  color: var(--orange-deep);
  font-weight: 600;
}

.ranking-icon {
  display: grid;
  place-items: center;
  width: 33px;
  height: 33px;
  color: var(--cat);
  background: color-mix(in srgb, var(--cat) 10%, #fff);
  border-radius: 10px;
}

.ranking-main {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.ranking-name {
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 600;
}

.ranking-bar {
  width: 100%;
  height: 4px;
  overflow: hidden;
  background: #f0ece2;
  border-radius: 999px;
}

.ranking-bar span {
  display: block;
  width: var(--share);
  height: 100%;
  background: var(--cat);
  border-radius: inherit;
  opacity: 0.8;
}

.ranking-share {
  color: var(--muted);
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.ranking-total {
  color: var(--ink-soft);
  font-family: var(--font-number);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

/* ==========================================================================
   分类页
   ========================================================================== */

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}

.category-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 160px;
  padding: 18px;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  transition:
    transform 0.2s var(--ease),
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.category-card::before {
  content: "";
  position: absolute;
  top: -30px;
  right: -30px;
  width: 105px;
  height: 105px;
  background: color-mix(in srgb, var(--cat) 7%, transparent);
  border-radius: 50%;
}

.category-card:hover {
  border-color: color-mix(in srgb, var(--cat) 30%, var(--line));
  box-shadow: 0 15px 36px rgba(32, 47, 38, 0.07);
  transform: translateY(-2px);
}

.category-card-top {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 11px;
}

.category-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  flex: none;
  color: var(--cat);
  background: color-mix(in srgb, var(--cat) 11%, #fff);
  border: 1px solid color-mix(in srgb, var(--cat) 14%, transparent);
  border-radius: 13px;
}

.category-card-title {
  flex: 1;
  min-width: 0;
  padding-top: 3px;
}

.category-name {
  overflow: hidden;
  color: var(--ink);
  font-size: 14px;
  font-weight: 650;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.category-sub {
  margin-top: 3px;
  color: var(--faint);
  font-size: 9.5px;
}

.category-card-actions {
  display: flex;
  gap: 3px;
  opacity: 0.62;
  transition: opacity 0.18s ease;
}

.category-card:hover .category-card-actions,
.category-card:focus-within .category-card-actions {
  opacity: 1;
}

.mini-icon-button {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  color: var(--muted);
  border-radius: 8px;
  transition:
    color 0.18s ease,
    background 0.18s ease;
}

.mini-icon-button:hover {
  color: var(--green-deep);
  background: var(--green-pale);
}

.mini-icon-button.is-danger:hover {
  color: var(--red);
  background: var(--red-soft);
}

.category-amount {
  position: relative;
  margin-top: auto;
  padding-top: 22px;
  color: var(--ink);
  font-family: var(--font-number);
  font-size: 25px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.025em;
  line-height: 1.2;
}

.category-amount small {
  margin-left: 3px;
  color: var(--faint);
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0;
}

.category-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 7px;
  color: var(--muted);
  font-size: 9.5px;
}

.category-share {
  display: flex;
  align-items: center;
  gap: 5px;
}

.category-share::before {
  content: "";
  width: 5px;
  height: 5px;
  background: var(--cat);
  border-radius: 50%;
}

.category-add-card {
  display: grid;
  place-items: center;
  align-content: center;
  gap: 9px;
  min-height: 160px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  background: rgba(255, 253, 248, 0.35);
  border: 1px dashed #cec7b6;
  border-radius: var(--radius-md);
  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
}

.category-add-card:hover {
  color: var(--green);
  background: rgba(255, 253, 248, 0.7);
  border-color: #aabfa9;
}

.category-add-icon {
  display: grid;
  place-items: center;
  width: 37px;
  height: 37px;
  color: var(--green);
  background: var(--green-pale);
  border-radius: 50%;
}

.data-panel {
  margin-top: 22px;
}

.data-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.data-stats {
  color: var(--faint);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

.data-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin-top: 18px;
}

.data-action {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 13px;
  text-align: left;
  background: #faf7f0;
  border: 1px solid var(--line);
  border-radius: 12px;
  transition:
    background 0.18s ease,
    border-color 0.18s ease,
    transform 0.18s var(--ease);
}

.data-action:hover {
  background: var(--paper-white);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.data-action-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: none;
  color: var(--green);
  background: var(--green-pale);
  border-radius: 9px;
}

.data-action.is-danger .data-action-icon {
  color: var(--red);
  background: var(--red-soft);
}

.data-action-copy {
  min-width: 0;
}

.data-action strong {
  display: block;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}

.data-action span {
  display: block;
  margin-top: 1px;
  overflow: hidden;
  color: var(--faint);
  font-size: 9px;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.data-action.is-danger strong {
  color: var(--red);
}

.privacy-line {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 15px;
  color: var(--faint);
  font-size: 9.5px;
}

.privacy-line .icon {
  color: var(--green);
}

/* ==========================================================================
   对话框与表单
   ========================================================================== */

dialog.sheet {
  width: min(590px, calc(100vw - 32px));
  max-width: none;
  max-height: calc(100dvh - 36px);
  padding: 0;
  margin: auto;
  overflow: hidden;
  color: var(--ink);
  background: var(--paper);
  border: 0;
  border-radius: 25px;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.4) inset,
    var(--shadow-float);
}

dialog.sheet[open] {
  animation: sheet-in 0.28s var(--ease) both;
}

dialog.sheet::backdrop {
  background: rgba(19, 33, 26, 0.43);
  backdrop-filter: blur(3px);
  animation: backdrop-in 0.25s ease both;
}

dialog.confirm-sheet {
  width: min(430px, calc(100vw - 32px));
}

.sheet-form {
  display: flex;
  flex-direction: column;
  max-height: calc(100dvh - 36px);
}

.sheet-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 23px 25px 10px;
}

.sheet-head-copy {
  flex: 1;
  min-width: 0;
}

.sheet-kicker {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  color: var(--orange-deep);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
}

.sheet-kicker::before {
  content: "";
  width: 14px;
  height: 1px;
  background: currentColor;
  opacity: 0.7;
}

.sheet-head h2 {
  color: var(--ink);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.3;
}

.sheet-head p {
  margin-top: 3px;
  color: var(--faint);
  font-size: 10.5px;
}

.sheet-close {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  flex: none;
  color: var(--muted);
  background: #f5f2e9;
  border-radius: 9px;
}

.sheet-close:hover {
  color: var(--ink);
  background: var(--bg-deep);
}

.sheet-body {
  padding: 8px 25px 22px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.sheet-foot {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 15px 25px calc(17px + env(safe-area-inset-bottom, 0px));
  background: #fbf8f1;
  border-top: 1px solid var(--line);
}

.sheet-foot-spacer {
  flex: 1;
}

.sheet-foot .btn {
  min-width: 88px;
}

.amount-field {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 16px 4px 19px;
  margin-bottom: 20px;
  border-bottom: 1px dashed var(--line-strong);
}

.amount-currency {
  align-self: flex-start;
  margin-top: 15px;
  color: var(--green);
  font-family: var(--font-number);
  font-size: 24px;
  line-height: 1;
}

.amount-input {
  width: min(360px, 72%);
  padding: 0;
  color: var(--green-deep);
  font-family: var(--font-number);
  font-size: clamp(40px, 6vw, 54px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  text-align: center;
  background: transparent;
  border: 0;
  outline: 0;
}

.amount-input::placeholder {
  color: #c9cec5;
}

.amount-unit {
  align-self: flex-end;
  margin-bottom: 9px;
  color: var(--faint);
  font-size: 10px;
}

.form-error {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 9px 11px;
  margin-bottom: 13px;
  color: var(--red);
  font-size: 10.5px;
  line-height: 1.5;
  background: var(--red-soft);
  border: 1px solid #f0d2cc;
  border-radius: 9px;
}

.form-error[hidden] {
  display: none;
}

.field {
  display: grid;
  gap: 6px;
  min-width: 0;
  margin-bottom: 15px;
}

.field > span,
.field > legend,
.field-label {
  color: var(--ink-soft);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
}

.field > span em,
.field-label em {
  margin-left: 4px;
  color: var(--faint);
  font-style: normal;
  font-weight: 400;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  height: 43px;
  padding: 0 12px;
  color: var(--ink);
  font-size: 12.5px;
  background: #fbf9f3;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: 0;
  transition:
    border-color 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
}

.field textarea {
  min-height: 70px;
  padding-top: 10px;
  resize: vertical;
}

.field input::placeholder,
.field textarea::placeholder {
  color: #b0b5ad;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  background: var(--paper-white);
  border-color: #a8c0af;
  box-shadow: 0 0 0 3px rgba(60, 125, 106, 0.08);
}

.field input[type="date"] {
  color-scheme: light;
}

.field-row {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  gap: 12px;
}

.field-row .field {
  margin-bottom: 14px;
}

fieldset.field {
  padding: 0;
  margin: 0 0 15px;
  border: 0;
}

fieldset.field > legend {
  padding: 0;
  margin-bottom: 7px;
}

.category-picker {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}

.category-choice {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  height: 44px;
  padding: 0 9px;
  color: var(--ink-soft);
  text-align: left;
  background: #fbf9f3;
  border: 1px solid var(--line);
  border-radius: 10px;
  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
}

.category-choice:hover {
  background: var(--paper-white);
  border-color: var(--line-strong);
}

.category-choice-icon {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  flex: none;
  color: var(--cat);
  background: color-mix(in srgb, var(--cat) 10%, #fff);
  border-radius: 8px;
}

.category-choice-name {
  overflow: hidden;
  font-size: 11px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.category-choice.is-selected {
  color: var(--green-deep);
  background: var(--green-pale);
  border-color: #a9c1af;
  box-shadow: 0 0 0 2px rgba(60, 125, 106, 0.06);
}

.category-choice.is-selected .category-choice-name {
  font-weight: 650;
}

.quick-category-block {
  margin-top: 8px;
}

.quick-category-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 27px;
  color: var(--green);
  font-size: 10px;
  font-weight: 600;
}

.quick-category-toggle:hover {
  color: var(--orange-deep);
}

.quick-category-form {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.quick-category-form[hidden] {
  display: none;
}

.quick-category-form input {
  flex: 1;
  min-width: 0;
  height: 36px;
  padding: 0 10px;
  font-size: 11px;
  background: #fbf9f3;
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: 0;
}

.quick-category-form input:focus {
  background: var(--paper-white);
  border-color: #a8c0af;
}

.quick-category-form button {
  flex: none;
}

.form-tip {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin-top: 5px;
  color: var(--faint);
  font-size: 9.5px;
  line-height: 1.6;
}

.form-tip .icon {
  margin-top: 1px;
  color: var(--green);
}

.delete-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 34px;
  color: var(--red);
  font-size: 10.5px;
  font-weight: 600;
}

.delete-link:hover {
  color: #903830;
}

/* 分类表单 */

.category-form-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  margin-bottom: 18px;
  background: #faf7f0;
  border: 1px solid var(--line);
  border-radius: 14px;
}

.category-form-preview .category-icon {
  width: 46px;
  height: 46px;
}

.category-form-preview strong {
  display: block;
  color: var(--ink);
  font-size: 14px;
  font-weight: 650;
}

.category-form-preview p {
  margin-top: 2px;
  color: var(--faint);
  font-size: 9.5px;
}

.icon-picker {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 6px;
}

.icon-picker input,
.color-picker input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.icon-choice {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  color: var(--muted);
  background: #fbf9f3;
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
  transition:
    color 0.18s ease,
    background 0.18s ease,
    border-color 0.18s ease;
}

.icon-choice:hover {
  color: var(--green);
  background: var(--paper-white);
}

.icon-picker input:checked + .icon-choice {
  color: var(--green-deep);
  background: var(--green-soft);
  border-color: #91ad9a;
  box-shadow: 0 0 0 2px rgba(60, 125, 106, 0.07);
}

.icon-picker input:focus-visible + .icon-choice {
  outline: 2px solid var(--orange);
  outline-offset: 2px;
}

.color-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 3px;
}

.color-choice {
  position: relative;
  width: 27px;
  height: 27px;
  background: var(--swatch);
  border: 2px solid var(--paper);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 0 1px rgba(30, 40, 32, 0.1);
  transition:
    transform 0.18s var(--ease),
    box-shadow 0.18s ease;
}

.color-choice:hover {
  transform: scale(1.08);
}

.color-picker input:checked + .color-choice {
  box-shadow:
    0 0 0 2px var(--paper),
    0 0 0 4px var(--swatch);
}

.color-picker input:focus-visible + .color-choice {
  outline: 2px solid var(--orange);
  outline-offset: 4px;
}

/* 确认框 */

.confirm-card {
  padding: 26px;
  text-align: center;
}

.confirm-icon {
  display: grid;
  place-items: center;
  width: 49px;
  height: 49px;
  margin: 0 auto 14px;
  color: var(--red);
  background: var(--red-soft);
  border-radius: 15px;
}

.confirm-sheet.is-neutral .confirm-icon {
  color: var(--green);
  background: var(--green-pale);
}

.confirm-card h2 {
  color: var(--ink);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.confirm-card p {
  max-width: 330px;
  margin: 8px auto 0;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.75;
  white-space: pre-line;
}

.confirm-actions {
  display: flex;
  gap: 9px;
  justify-content: center;
  padding-top: 22px;
}

.confirm-actions .btn {
  min-width: 102px;
}

/* ==========================================================================
   Toast
   ========================================================================== */

.toast-stack {
  position: fixed;
  top: auto;
  right: 24px;
  bottom: 24px;
  left: auto;
  z-index: 120;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  width: auto;
  height: auto;
  max-width: none;
  max-height: none;
  padding: 0;
  margin: 0;
  overflow: visible;
  color: inherit;
  background: transparent;
  border: 0;
  pointer-events: none;
}

.toast-stack:not(:popover-open) {
  display: none;
}

.toast-stack:popover-open {
  display: flex;
}

.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: min(360px, calc(100vw - 36px));
  padding: 11px 15px;
  color: #fbf8ee;
  font-size: 11.5px;
  line-height: 1.5;
  background: rgba(23, 63, 50, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 11px;
  box-shadow: 0 14px 34px rgba(23, 45, 34, 0.2);
  animation: toast-in 0.3s var(--ease) both;
  backdrop-filter: blur(8px);
}

.toast.is-error {
  background: rgba(154, 58, 50, 0.97);
}

.toast .toast-icon {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  flex: none;
  color: var(--green-deep);
  background: #d9eadf;
  border-radius: 50%;
}

.toast.is-error .toast-icon {
  color: var(--red);
  background: #fbe6e2;
}

.toast.is-leaving {
  animation: toast-out 0.22s ease both;
}

function pad2(value) {
  return String(value).padStart(2, '0');
}

function uid(prefix = 'id') {
  const random = globalThis.crypto?.randomUUID?.()
    ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  return `${prefix}-${random}`;
}

/* ------------------------------------------------------------------ */
/* 金额                                                                */
/* ------------------------------------------------------------------ */

/**
 * 把用户输入（"12.5" / "¥ 1,024" / 12.5）转换成整数分。
 * 非法、为零、超过上限时返回 null。
 */
function amountToCents(input) {
  if (typeof input === 'number') {
    if (!Number.isFinite(input) || input <= 0) return null;
    const cents = Math.round(input * 100);
    return cents > 0 && cents <= MAX_AMOUNT_CENTS ? cents : null;
  }

  let text = String(input ?? '').trim().replace(/[,\s¥￥]/g, '');
  if (!text) return null;
  if (text.startsWith('.')) text = `0${text}`;
  if (!/^\d{1,9}(\.\d{0,2})?$/.test(text)) return null;

  const [whole, fraction = ''] = text.split('.');
  const cents = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));
  if (!Number.isSafeInteger(cents) || cents <= 0 || cents > MAX_AMOUNT_CENTS) return null;
  return cents;
}

function formatAmount(cents) {
  const safe = Math.max(0, Math.round(Number(cents) || 0));
  const yuan = Math.floor(safe / 100);
  const fraction = String(safe % 100).padStart(2, '0');
  return `${yuan.toLocaleString('en-US')}.${fraction}`;
}

function formatMoney(cents) {
  return `¥${formatAmount(cents)}`;
}

function formatInputAmount(cents) {
  return formatAmount(cents).replace(/,/g, '');
}

function formatCompactMoney(cents) {
  const yuan = Math.max(0, Number(cents) || 0) / 100;
  if (yuan >= 100_000_000) return `¥${trimZero(yuan / 100_000_000)}亿`;
  if (yuan >= 10_000) return `¥${trimZero(yuan / 10_000)}万`;
  return `¥${formatAmount(cents).replace(/\.00$/, '')}`;
}

function trimZero(value) {
  return value.toFixed(1).replace(/\.0$/, '');
}

/* ------------------------------------------------------------------ */
/* 日期                                                                */
/* ------------------------------------------------------------------ */

function toISODate(date = new Date()) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function todayISO(now = new Date()) {
  return toISODate(now);
}

function isISODate(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const [year, month, day] = value.split('-').map(Number);
  if (year < 1900 || year > 2200) return false;
  const date = new Date(year, month - 1, day);
  return date.getFullYear() === year
    && date.getMonth() === month - 1
    && date.getDate() === day;
}

function parseISODate(value) {
  if (!isISODate(value)) return null;
  const [year, month, day] = value.split('-').map(Number);
  return new Date(year, month - 1, day);
}

function monthKey(value = todayISO()) {
  const text = typeof value === 'string' ? value : toISODate(value);
  return text.slice(0, 7);
}

function currentMonthKey(now = new Date()) {
  return monthKey(todayISO(now));
}

function shiftMonth(month, delta) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + delta, 1);
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
}

function daysInMonth(month) {
  const [year, monthNumber] = month.split('-').map(Number);
  return new Date(year, monthNumber, 0).getDate();
}

function addDaysISO(value, amount) {
  const date = parseISODate(value);
  if (!date) return value;
  date.setDate(date.getDate() + amount);
  return toISODate(date);
}

function diffDays(later, earlier) {
  const a = parseISODate(later);
  const b = parseISODate(earlier);
  if (!a || !b) return 0;
  return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())
    - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 86_400_000);
}

const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

function weekdayLabel(value) {
  const date = parseISODate(value);
  return date ? WEEKDAYS[date.getDay()] : '';
}

function monthLabel(month, includeYear = true) {
  const [year, monthNumber] = month.split('-').map(Number);
  return includeYear ? `${year}年${monthNumber}月` : `${monthNumber}月`;
}

function dateLabel(value, { withWeekday = false, withYear = false } = {}) {
  const date = parseISODate(value);
  if (!date) return '';
  const base = `${withYear ? `${date.getFullYear()}年` : ''}${date.getMonth() + 1}月${date.getDate()}日`;
  return withWeekday ? `${base} ${WEEKDAYS[date.getDay()]}` : base;
}

function relativeDateLabel(value, today = todayISO()) {
  const delta = diffDays(today, value);
  if (delta === 0) return '今天';
  if (delta === 1) return '昨天';
  if (delta === 2) return '前天';
  return dateLabel(value);
}

function fullTodayLabel(now = new Date()) {
  return `${now.getMonth() + 1}月${now.getDate()}日 · ${WEEKDAYS[now.getDay()]}`;
}

function greeting(now = new Date()) {
  const hour = now.getHours();
  if (hour >= 5 && hour < 11) return '早上好';
  if (hour >= 11 && hour < 13) return '中午好';
  if (hour >= 13 && hour < 18) return '下午好';
  if (hour >= 18 && hour < 23) return '晚上好';
  return '夜深了';
}

/* ------------------------------------------------------------------ */
/* 记录与统计                                                          */
/* ------------------------------------------------------------------ */

function cloneCategories() {
  return DEFAULT_CATEGORIES.map((category) => ({ ...category }));
}

function createDefaultStore() {
  return {
    schemaVersion: SCHEMA_VERSION,
    categories: cloneCategories(),
    records: [],
    auto: defaultAutoSettings(),
    pending: [],
    incomes: [],
    autoSeen: [],
    updatedAt: new Date().toISOString(),
  };
}

function sortRecords(records) {
  return [...records].sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    const createdCompare = String(b.createdAt).localeCompare(String(a.createdAt));
    if (createdCompare !== 0) return createdCompare;
    return String(b.id).localeCompare(String(a.id));
  });
}

function recordsForMonth(records, month) {
  return records.filter((record) => record.date.startsWith(month));
}

function sumRecords(records) {
  return records.reduce((total, record) => total + record.amount, 0);
}

function totalsByDate(records) {
  const map = new Map();
  for (const record of records) {
    map.set(record.date, (map.get(record.date) ?? 0) + record.amount);
  }
  return map;
}

function dailyTotal(records, date) {
  return records.reduce((total, record) => (record.date === date ? total + record.amount : total), 0);
}

function summarizeMonth(records, month, { today = todayISO() } = {}) {
  const monthRecords = recordsForMonth(records, month);
  const total = sumRecords(monthRecords);
  const activeDays = new Set(monthRecords.map((record) => record.date)).size;
  const todayMonth = monthKey(today);
  const calendarDays = daysInMonth(month);
  const elapsedDays = month < todayMonth
    ? calendarDays
    : month === todayMonth
      ? Number(today.slice(8, 10))
      : 0;
  const maxRecord = monthRecords.reduce((largest, record) => {
    if (!largest) return record;
    if (record.amount > largest.amount) return record;
    return largest;
  }, null);

  return {
    month,
    records: monthRecords,
    total,
    count: monthRecords.length,
    activeDays,
    calendarDays,
    elapsedDays,
    dailyAverage: elapsedDays > 0 ? Math.round(total / elapsedDays) : 0,
    activeDayAverage: activeDays > 0 ? Math.round(total / activeDays) : 0,
    maxRecord,
  };
}

function lastNDays(records, endDate = todayISO(), count = 7) {
  const totals = totalsByDate(records);
  return Array.from({ length: count }, (_, index) => {
    const date = addDaysISO(endDate, index - count + 1);
    return {
      date,
      total: totals.get(date) ?? 0,
      isToday: date === endDate,
    };
  });
}

function monthDays(records, month) {
  const totals = totalsByDate(recordsForMonth(records, month));
  const days = daysInMonth(month);
  return Array.from({ length: days }, (_, index) => {
    const day = index + 1;
    const date = `${month}-${pad2(day)}`;
    return {
      date,
      day,
      total: totals.get(date) ?? 0,
      weekday: weekdayLabel(date),
    };
  });
}

function categoryBreakdown(records, categories) {
  const byCategory = new Map();
  for (const record of records) {
    const item = byCategory.get(record.categoryId) ?? { total: 0, count: 0 };
    item.total += record.amount;
    item.count += 1;
    byCategory.set(record.categoryId, item);
  }

  const total = sumRecords(records);
  return categories
    .map((category) => {
      const item = byCategory.get(category.id) ?? { total: 0, count: 0 };
      return {
        category,
        total: item.total,
        count: item.count,
        share: total > 0 ? item.total / total : 0,
      };
    })
    .filter((item) => item.total > 0)
    .sort((a, b) => b.total - a.total);
}

function previousMonthTotal(records, month) {
  return sumRecords(recordsForMonth(records, shiftMonth(month, -1)));
}

function findCategory(categories, id) {
  return categories.find((category) => category.id === id) ?? null;
}

function monthInsights(records, month, categories) {
  const summary = summarizeMonth(records, month);
  const totals = totalsByDate(summary.records);
  let busiestDay = null;
  for (const [date, total] of totals.entries()) {
    if (!busiestDay || total > busiestDay.total) busiestDay = { date, total };
  }
  const breakdown = categoryBreakdown(summary.records, categories);
  return {
    ...summary,
    breakdown,
    topCategory: breakdown[0] ?? null,
    busiestDay,
    previousTotal: previousMonthTotal(records, month),
  };
}

/* ------------------------------------------------------------------ */
/* 数据清洗、备份与导出                                                */
/* ------------------------------------------------------------------ */

function cleanName(value, fallback = '未命名') {
  const name = String(value ?? '').replace(/\s+/g, ' ').trim().slice(0, 20);
  return name || fallback;
}

function cleanColor(value, fallback) {
  return /^#[0-9a-fA-F]{6}$/.test(String(value ?? '')) ? String(value).toUpperCase() : fallback;
}

function cleanId(value, prefix) {
  const text = String(value ?? '');
  return /^[A-Za-z0-9_-]{1,80}$/.test(text) ? text : uid(prefix);
}

function validDate(value) {
  return isISODate(value) ? value : null;
}

function validTimestamp(value, fallback) {
  if (typeof value === 'string') {
    const timestamp = Date.parse(value);
    if (Number.isFinite(timestamp)) return new Date(timestamp).toISOString();
  }
  return fallback;
}

/**
 * 把读入的数据整理成可信结构。数据明显不是本应用的结构时抛出错误。
 */
function normalizeStore(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.categories) || !Array.isArray(raw.records)) {
    throw new Error('数据格式不正确：缺少分类或账单列表。');
  }
  if (raw.categories.length === 0) {
    throw new Error('数据格式不正确：至少需要一个分类。');
  }

  const categories = [];
  const idMap = new Map();
  const usedNames = new Set();

  for (const [index, rawCategory] of raw.categories.slice(0, 120).entries()) {
    if (!rawCategory || typeof rawCategory !== 'object') continue;
    let id = cleanId(rawCategory.id, 'cat');
    if (idMap.has(id)) id = uid('cat');
    let name = cleanName(rawCategory.name, `分类 ${index + 1}`).slice(0, 12);
    if (usedNames.has(name)) {
      let suffix = 2;
      while (usedNames.has(`${name} ${suffix}`)) suffix += 1;
      name = `${name} ${suffix}`.slice(0, 16);
    }
    usedNames.add(name);
    const icon = CATEGORY_ICONS.includes(rawCategory.icon) ? rawCategory.icon : 'tag';
    const color = cleanColor(rawCategory.color, COLOR_PALETTE[index % COLOR_PALETTE.length]);
    idMap.set(rawCategory.id, id);
    categories.push({ id, name, icon, color });
  }

  if (categories.length === 0) {
    throw new Error('数据格式不正确：没有可用的分类。');
  }

  const records = [];
  const recordIds = new Set();
  const fallbackCategory = categories[categories.length - 1].id;

  for (const rawRecord of raw.records.slice(0, MAX_RECORDS)) {
    if (!rawRecord || typeof rawRecord !== 'object') continue;
    const amount = Number.isSafeInteger(rawRecord.amount) && rawRecord.amount > 0
      ? rawRecord.amount
      : amountToCents(rawRecord.amount ?? rawRecord.amountCents ?? '');
    const date = validDate(rawRecord.date);
    if (!amount || !date || amount > MAX_AMOUNT_CENTS) continue;

    let id = cleanId(rawRecord.id, 'rec');
    if (recordIds.has(id)) id = uid('rec');
    recordIds.add(id);

    let categoryId = idMap.get(rawRecord.categoryId) ?? null;
    if (!categoryId) {
      categoryId = findCategory(categories, rawRecord.categoryId)?.id ?? fallbackCategory;
    }

    const fallbackTimestamp = `${date}T12:00:00.000Z`;
    const createdAt = validTimestamp(rawRecord.createdAt, fallbackTimestamp);
    const updatedAt = validTimestamp(rawRecord.updatedAt, createdAt);

    records.push({
      id,
      name: cleanName(rawRecord.name, '一笔支出').slice(0, 40),
      amount,
      categoryId,
      date,
      note: String(rawRecord.note ?? '').replace(/\s+/g, ' ').trim().slice(0, 200),
      createdAt,
      updatedAt,
    });
  }

  return {
    schemaVersion: SCHEMA_VERSION,
    categories,
    records,
    auto: normalizeAutoSettings(raw.auto, categories),
    pending: normalizeAutoPending(raw.pending, categories),
    incomes: normalizeAutoIncomes(raw.incomes),
    autoSeen: [],
    updatedAt: new Date().toISOString(),
  };
}

function validateBackup(raw) {
  if (!raw || typeof raw !== 'object') {
    return { ok: false, error: '文件内容不是有效的 JSON 对象。' };
  }
  if (raw.format && raw.format !== BACKUP_FORMAT) {
    return { ok: false, error: '这不是小满账本导出的备份文件。' };
  }
  if (!Array.isArray(raw.records) || !Array.isArray(raw.categories)) {
    return { ok: false, error: '备份文件里缺少账单或分类数据。' };
  }
  try {
    const store = normalizeStore(raw);
    return {
      ok: true,
      store,
      warnings: raw.records.length > store.records.length
        ? `有 ${raw.records.length - store.records.length} 条损坏或不完整的记录未被导入。`
        : '',
    };
  } catch (error) {
    return { ok: false, error: error instanceof Error ? error.message : '备份文件无法读取。' };
  }
}

function backupPayload(store) {
  return {
    app: APP_NAME,
    format: BACKUP_FORMAT,
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    categories: store.categories,
    records: store.records,
    auto: store.auto,
    pending: store.pending,
    incomes: store.incomes,
  };
}

function csvCell(value) {
  let text = String(value ?? '');
  if (/^[=+\-@]/.test(text)) text = `'${text}`;
  if (/[",\r\n]/.test(text)) text = `"${text.replace(/"/g, '""')}"`;
  return text;
}

function recordsToCSV(records, categories) {
  const categoryMap = new Map(categories.map((category) => [category.id, category.name]));
  const lines = ['日期,消费名称,分类,金额（元）,备注'];
  const ascending = [...records].sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return String(a.createdAt).localeCompare(String(b.createdAt));
  });
  for (const record of ascending) {
    lines.push([
      record.date,
      csvCell(record.name),
      csvCell(categoryMap.get(record.categoryId) ?? '未分类'),
      (record.amount / 100).toFixed(2),
      csvCell(record.note),
    ].join(','));
  }
  return lines.join('\r\n');
}

}

function categoryColor(category) {
  return category?.color || '#858D95';
}

function getCategory(id) {
  return findCategory(store.categories, id) ?? store.categories[store.categories.length - 1];
}

function shareLabel(share) {
  const percentage = share * 100;
  if (percentage > 0 && percentage < 1) return '&lt;1%';
  return `${Math.round(percentage)}%`;
}

function percentChange(current, previous) {
  if (!previous) return null;
  return ((current - previous) / previous) * 100;
}

function formatChange(change) {
  if (change === null) return '';
  const absolute = Math.abs(change);
  if (absolute >= 999) return change > 0 ? '+999% 以上' : '-99% 以上';
  const fixed = absolute.toFixed(1).replace(/\.0$/, '');
  return `${change > 0 ? '+' : change < 0 ? '-' : ''}${fixed}%`;
}

function categoryIconMarkup(category, size = 20) {
  return `<span class="category-icon" style="--cat:${categoryColor(category)}">${iconSvg(category.icon, { size })}</span>`;
}

function recordIconMarkup(category, size = 20) {
  return `<span class="record-icon" style="--cat:${categoryColor(category)}">${iconSvg(category.icon, { size })}</span>`;
}

/* ------------------------------------------------------------------ */
/* 平台能力（iOS / Android / 桌面浏览器）                              */
/* ------------------------------------------------------------------ */

function isIOS() {
  const ua = String(navigator.userAgent ?? '');
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  // iPadOS 13+ 会把自己伪装成 Mac
  return navigator.platform === 'MacIntel' && (navigator.maxTouchPoints ?? 0) > 1;
}

function isAndroid() {
  return /Android/i.test(String(navigator.userAgent ?? ''));
}

const IOS_INSTALL_HINT = '在 Safari 里点底部的「分享」按钮 → 往下找「添加到主屏幕」→ 添加，就能像 App 一样全屏打开。';

/** iOS 上把导出的文件交给系统分享面板，可以直接存到「文件」App。 */
async function shareFileFallback(filename, content, mimeType) {
  if (typeof navigator.share !== 'function' || typeof File !== 'function') return false;
  try {
    const file = new File([content], filename, { type: mimeType });
    if (typeof navigator.canShare === 'function' && !navigator.canShare({ files: [file] })) {
      return false;
    }
    await navigator.share({ files: [file], title: filename });
    return true;
  } catch (error) {
    // 用户取消分享也会走到这里，不算失败
    console.warn('分享文件未完成', error);
    return false;
  }
}

function isStandalone() {
  return window.matchMedia?.('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

function trendMarkup(total, previous) {
  const change = percentChange(total, previous);
  if (change === null) {
    return `<span class="trend-chip is-flat">${iconSvg('minus', { size: 10 })} 上月无记录</span>`;

  const direction = change > 0 ? 'is-up' : change < 0 ? 'is-down' : 'is-flat';
  const iconName = change > 0 ? 'trendUp' : change < 0 ? 'trendDown' : 'minus';
  return `<span class="trend-chip ${direction}">${iconSvg(iconName, { size: 11 })} 较上月 ${formatChange(change)}</span>`;

function renderWeeklyChart() {
  const today = todayISO();
  const days = lastNDays(store.records, today, 7);
  const max = Math.max(0, ...days.map((day) => day.total));
  const total = days.reduce((sum, day) => sum + day.total, 0);
  const busiest = days.reduce((best, day) => (!best || day.total > best.total ? day : best), null);

  const columns = days.map((day) => {
    const height = day.total > 0 && max > 0
      ? Math.max(7, Math.round((day.total / max) * 86))
      : 0;
    const classes = ['bar', day.isToday ? 'is-today' : '', day.total === 0 ? 'is-empty' : '']
      .filter(Boolean)
      .join(' ');
    const dayName = day.isToday ? '今天' : weekdayLabel(day.date);
    return `
      <div class="bar-column" tabindex="0" aria-label="${dateLabel(day.date, { withWeekday: true })}，支出 ${formatMoney(day.total)}">
        <div class="bar-plot">
          <div class="${classes}" style="--bar-height:${height}%">
            <span class="bar-value">${formatMoney(day.total)}</span>
          </div>
        </div>
        <span class="bar-label ${day.isToday ? 'is-today' : ''}">
          <strong>${dayName}</strong>
          <span>${Number(day.date.slice(5, 7))}/${Number(day.date.slice(8, 10))}</span>
        </span>
      </div>`;
  }).join('');

  const footerNote = total > 0
    ? `最高 ${busiest && busiest.total > 0 ? `${dateLabel(busiest.date)} · ${formatCompactMoney(busiest.total)}` : '—'}`
    : '这 7 天还没有记录';

  return `
    <section class="panel chart-panel" aria-labelledby="weekly-title">
      <div class="panel-head">
        <div class="panel-title">
          <h2 id="weekly-title">最近 7 天</h2>

      </div>
      <div class="chart-footer">
        <span>${footerNote}</span>
        <span>合计 <strong>${formatMoney(total)}</strong></span>
      </div>
    </section>`;
}

function donutGradient(breakdown) {
  if (!breakdown.length) return '#ece6da';
  let cursor = 0;
  const stops = breakdown.map((item) => {
    const start = cursor;
    cursor += item.share * 100;
    return `${item.category.color} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function filteredLedgerRecords() {
  const query = ui.ledger.query.trim().toLocaleLowerCase('zh-CN');
  const categoryMap = new Map(store.categories.map((category) => [category.id, category.name]));
  return sortRecords(store.records.filter((record) => {
    if (!record.date.startsWith(ui.ledger.month)) return false;
    if (ui.ledger.day && record.date !== ui.ledger.day) return false;
    if (ui.ledger.categoryId !== 'all' && record.categoryId !== ui.ledger.categoryId) return false;
    if (query) {
      const haystack = [
        record.name,
        record.note,
        categoryMap.get(record.categoryId) ?? '',
      ].join(' ').toLocaleLowerCase('zh-CN');
      if (!haystack.includes(query)) return false;
    }
    return true;
  }));
}

function hasLedgerFilters() {
  return Boolean(ui.ledger.query.trim())
    || ui.ledger.categoryId !== 'all'
    || Boolean(ui.ledger.day);
}

function renderLedgerSummary(list) {
  const dayCount = new Set(list.map((record) => record.date)).size;
  const total = list.reduce((sum, record) => sum + record.amount, 0);
  return `
    <div class="ledger-summary-main">

}

function renderLedgerResultsHTML(list) {
  if (!list.length) {
    if (hasLedgerFilters()) {
      return renderEmptyState({
        icon: 'search',
        title: '没有找到符合条件的记录',
        description: '换一个关键词，或清除筛选后再看看。',
        action: 'clear-filters',
        actionLabel: '清除筛选',
      });
    }
    return renderEmptyState({
      icon: 'receipt',

      action: 'open-add',

  const groups = new Map();
  for (const record of list) {
    if (!groups.has(record.date)) groups.set(record.date, []);

  const groupsHTML = [...groups.entries()].map(([date, records]) => {
    const total = records.reduce((sum, record) => sum + record.amount, 0);

    return `

  return `${groupsHTML}<div class="result-footer">已显示全部 ${list.length} 笔记录 · 数据只保存在本机</div>`;

function calendarMarkup(month, records) {
  const days = monthDays(records, month);
  const max = Math.max(0, ...days.map((day) => day.total));
  const today = todayISO();
  const [year, monthNumber] = month.split('-').map(Number);
  const offset = (new Date(year, monthNumber - 1, 1).getDay() + 6) % 7;
  const blanks = Array.from({ length: offset }, () => '<div class="calendar-cell is-blank" aria-hidden="true"></div>').join('');

  const cells = days.map((day) => {
    if (day.total <= 0) {
      return `<div class="calendar-cell ${day.date === today ? 'is-today' : ''}" aria-label="${dateLabel(day.date)}，无支出">
        <span class="cell-day">${day.day}</span>
      </div>`;
    }
    const ratio = max > 0 ? day.total / max : 0;
    const level = ratio >= 0.75 ? 4 : ratio >= 0.45 ? 3 : ratio >= 0.2 ? 2 : 1;
    return `<button class="calendar-cell level-${level} ${day.date === today ? 'is-today' : ''}" type="button"
      data-action="stats-day" data-date="${day.date}"
      aria-label="${dateLabel(day.date, { withWeekday: true })}，支出 ${formatMoney(day.total)}，查看当日流水">
      <span class="cell-day">${day.day}</span>
      <span class="cell-total">${formatCompactMoney(day.total)}</span>
    </button>`;
  }).join('');

  return `
    <div class="calendar-weekdays" aria-hidden="true">
