function defaultAutoSettings() {
  return {
    enabled: true,
    autoConfirm: false,
    recordIncome: true,
    rules: [],
    lastSyncAt: '',
  };
}

function normalizeAutoSettings(raw, categories) {
  const settings = defaultAutoSettings();
  if (!raw || typeof raw !== 'object') return settings;
  settings.enabled = raw.enabled !== false;
  settings.autoConfirm = raw.autoConfirm === true;
  settings.recordIncome = raw.recordIncome !== false;
  settings.lastSyncAt = typeof raw.lastSyncAt === 'string' ? raw.lastSyncAt : '';
  const rules = [];
  const seen = new Set();
  const list = Array.isArray(raw.rules) ? raw.rules.slice(0, 80) : [];
  for (const item of list) {
    if (!item || typeof item !== 'object') continue;
    const match = String(item.match ?? '').replace(/\s+/g, ' ').trim().slice(0, 20);
    const category = findCategory(categories, item.categoryId);
    if (!match || !category) continue;
    const key = `${match}|${category.id}`;
    if (seen.has(key)) continue;
    seen.add(key);
    rules.push({ id: cleanId(item.id, 'rule'), match, categoryId: category.id });
  }
  settings.rules = rules;
  return settings;
}

function normalizeAutoPending(raw, categories) {
  const list = [];
  const ids = new Set();
  const fallbackCategory = categories[categories.length - 1].id;
  const source = Array.isArray(raw) ? raw.slice(-200) : [];
  for (const item of source) {
    if (!item || typeof item !== 'object') continue;
    const amount = Number.isSafeInteger(item.amount) && item.amount > 0
      ? item.amount
      : amountToCents(item.amount ?? '');
    const date = validDate(item.date);
    if (!amount || !date) continue;
    let id = cleanId(item.id, 'pend');
    if (ids.has(id)) id = uid('pend');
    ids.add(id);
    const category = findCategory(categories, item.categoryId) ?? findCategory(categories, fallbackCategory);
    list.push({
      id,
      name: cleanName(item.name, '一笔自动记录').slice(0, 40),
      amount,
      categoryId: category.id,
      date,
      source: AUTO_SOURCE_META[item.source] ? item.source : 'test',
      capturedAt: validTimestamp(item.capturedAt, `${date}T12:00:00.000Z`),
      text: String(item.text ?? '').replace(/\s+/g, ' ').trim().slice(0, 200),
    });
  }
  return list;
}

function normalizeAutoIncomes(raw) {
  const list = [];
  const source = Array.isArray(raw) ? raw.slice(0, 600) : [];
  for (const item of source) {
    if (!item || typeof item !== 'object') continue;
    const amount = Number.isSafeInteger(item.amount) && item.amount > 0
      ? item.amount
      : amountToCents(item.amount ?? '');
    const date = validDate(item.date);
    if (!amount || !date) continue;
    list.push({
      id: cleanId(item.id, 'inc'),
      amount,
      name: cleanName(item.name, '一笔收入').slice(0, 40),
      source: AUTO_SOURCE_META[item.source] ? item.source : 'import',
      date,
      capturedAt: validTimestamp(item.capturedAt, `${date}T12:00:00.000Z`),
      text: String(item.text ?? '').replace(/\s+/g, ' ').trim().slice(0, 200),
    });
  }
  return list;
}

function ensureAutoStore() {
  if (!store.auto || typeof store.auto !== 'object') store.auto = defaultAutoSettings();
  if (!Array.isArray(store.auto.rules)) store.auto.rules = [];
  if (!Array.isArray(store.pending)) store.pending = [];
  if (!Array.isArray(store.incomes)) store.incomes = [];
  if (!Array.isArray(store.autoSeen)) store.autoSeen = [];
  if (typeof store.auto.enabled !== 'boolean') store.auto.enabled = true;
  if (typeof store.auto.autoConfirm !== 'boolean') store.auto.autoConfirm = false;
  if (typeof store.auto.recordIncome !== 'boolean') store.auto.recordIncome = true;
}

function autoBridge() {
  const bridge = window.XiaomanAndroid;
  if (!bridge || typeof bridge.drainAutoRecords !== 'function') return null;
  return bridge;
}

function autoNativeAvailable() {
  return Boolean(autoBridge());
}

function autoAccessGranted() {
  const bridge = autoBridge();

function autoPickCategory(haystack) {
  const text = String(haystack ?? '');
  for (const rule of store.auto.rules) {
    if (rule.match && text.includes(rule.match)) {
      const category = findCategory(store.categories, rule.categoryId);
      if (category) return category.id;
    }
  }
  for (const guess of AUTO_GUESS_RULES) {
    if (!guess.words.some((word) => text.includes(word))) continue;
    const category = store.categories.find(
      (item) => item.name.includes(guess.category) || guess.category.includes(item.name),
    );
    if (category) return category.id;
  }
  return store.categories[store.categories.length - 1].id;
}

function autoTimeLabel(value) {
  const stamp = new Date(value);
  if (Number.isNaN(stamp.getTime())) return '';
  const day = toISODate(stamp);
  const time = `${pad2(stamp.getHours())}:${pad2(stamp.getMinutes())}`;
  return day === todayISO() ? `今天 ${time}` : `${dateLabel(day)} ${time}`;
}

/** 把原生侧解析出的一条通知记进账本。返回是否真的新增了内容。 */
function autoIngest(raw) {
  if (!raw || typeof raw !== 'object') return false;
  const amount = Number.isSafeInteger(raw.amount) ? raw.amount : Number(raw.amount);
  const stamp = Number(raw.t);
  if (!Number.isFinite(amount) || amount <= 0 || amount > 100_000_000) return false;
  if (!Number.isFinite(stamp) || stamp <= 0) return false;

  const source = AUTO_SOURCE_META[raw.source] ? raw.source : 'test';
  const fingerprint = `${Math.round(stamp / 1000)}|${amount}|${String(raw.text ?? '').slice(0, 80)}`;
  if (store.autoSeen.includes(fingerprint)) return false;
  store.autoSeen.push(fingerprint);
  while (store.autoSeen.length > 260) store.autoSeen.shift();

  const date = toISODate(new Date(stamp));
  const capturedAt = new Date(stamp).toISOString();
  const rawText = String(raw.text ?? '').replace(/\s+/g, ' ').trim().slice(0, 200);
  const isIncome = raw.dir === 'in';
  const name = cleanName(raw.merchant, isIncome ? '一笔收款' : '一笔支出');

  if (isIncome) {
    if (!store.auto.recordIncome) return false;
    store.incomes.unshift({
      id: uid('inc'),
      amount,
      name,
      source,
      date,
      capturedAt,
      text: rawText,
    });
    while (store.incomes.length > 600) store.incomes.pop();
    return true;
  }

  const categoryId = autoPickCategory(`${name} ${rawText}`);
  if (store.auto.autoConfirm) {
    store.records.push({
      id: uid('rec'),
      name,
      amount,
      categoryId,
      date,
      note: `${AUTO_SOURCE_META[source].label}自动记账`,
      createdAt: capturedAt,
      updatedAt: new Date().toISOString(),
      source,
    });
    return true;
  }

  store.pending.unshift({
    id: uid('pend'),
    name,
    amount,
    categoryId,
    date,
    source,
    capturedAt,
    text: rawText,
  });
  while (store.pending.length > 200) store.pending.pop();
  return true;
}

let autoSyncBusy = false;

function syncAutoRecords({ silent = true } = {}) {
  const bridge = autoBridge();
  if (!bridge || autoSyncBusy) return 0;
  if (!store.auto) return 0;
  if (!store.auto.enabled) {
    // 暂停时也要清空队列，避免恢复后一次性涌入过期记录
    try {
      bridge.drainAutoRecords();
    } catch (error) {
      console.warn('清空自动记账队列失败', error);
    }
    return 0;
  }
  autoSyncBusy = true;
  let added = 0;
  try {
    const payload = bridge.drainAutoRecords();
    const list = JSON.parse(String(payload ?? '[]'));
    if (Array.isArray(list)) {
      for (const item of list.slice(0, 120)) {
        if (autoIngest(item)) added += 1;
      }
    }
  } catch (error) {
    console.warn('自动记账同步失败', error);
  } finally {
    autoSyncBusy = false;
  }

  if (added > 0) {
    store.auto.lastSyncAt = new Date().toISOString();
    saveStore();
    if (!modalRoot.querySelector('dialog[open]')) render();
    showToast(`自动记账捕捉到 ${added} 笔，去「自动记账」确认`, { type: 'info', duration: 4200 });
  } else if (!silent) {
    showToast('暂时没有新的支付通知。');
  }
  return added;
}

function startAutoSync() {
  window.setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (!store.auto || !store.auto.enabled) return;
    syncAutoRecords({ silent: true });
  }, 5000);
}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let index = 0; index < 256; index += 1) {
    let value = index;
    for (let bit = 0; bit < 8; bit += 1) {
      value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
    }
    table[index] = value >>> 0;
  }
  return table;
})();

function crc32Step(crc, byte) {
  return (CRC_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8)) >>> 0;
}

function crc32Of(bytes) {
  let crc = 0xffffffff;
  for (let index = 0; index < bytes.length; index += 1) crc = crc32Step(crc, bytes[index]);
  return (crc ^ 0xffffffff) >>> 0;
}

function splitCsvLine(line, delimiter = ',') {
  const cells = [];
  let current = '';
  let quoted = false;
  for (let index = 0; index < line.length; index += 1) {
    const character = line[index];
    if (quoted) {
      if (character === '"') {
        if (line[index + 1] === '"') {
          current += '"';
          index += 1;
        } else {
          quoted = false;
        }
      } else {
        current += character;
      }
    } else if (character === '"') {
      quoted = true;
    } else if (character === delimiter) {
      cells.push(current);
      current = '';
    } else {
      current += character;
    }
  }
  cells.push(current);
  return cells.map((cell) => cell.replace(/^[\uFEFF\u200B]+/, '').trim());
}

/** 文本 → 二维表格。自动判断逗号 / 制表符 / 分号分隔。 */
function matrixFromDelimitedText(text) {
  const lines = String(text ?? '').replace(/\r\n?/g, '\n').split('\n');
  let delimiter = ',';
  for (const line of lines.slice(0, 60)) {
    if (!line.includes('交易时间')) continue;
    const tabs = (line.match(/\t/g) ?? []).length;
    const semicolons = (line.match(/;/g) ?? []).length;
    const commas = (line.match(/,/g) ?? []).length;
    if (tabs > commas && tabs > semicolons) delimiter = '\t';
    else if (semicolons > commas && semicolons > tabs) delimiter = ';';
    break;
  }
  return lines.map((line) => splitCsvLine(line, delimiter));
}

/** Excel 序列号日期（45678.5）→ 2025-01-01 */
function excelSerialToISODate(value) {
  const serial = Number(String(value ?? '').trim());
  if (!Number.isFinite(serial) || serial < 1 || serial > 200000) return null;
  const stamp = new Date(Math.round((serial - 25569) * 86400000));
  if (Number.isNaN(stamp.getTime())) return null;
  return `${stamp.getUTCFullYear()}-${pad2(stamp.getUTCMonth() + 1)}-${pad2(stamp.getUTCDate())}`;
}

function findBillHeader(matrix) {
  for (let index = 0; index < Math.min(matrix.length, 80); index += 1) {
    const cells = (matrix[index] ?? []).map((cell) => String(cell ?? '').trim());
    if (cells.includes('交易时间') && cells.some((cell) => cell === '收/支' || cell.startsWith('金额'))) {
      return { index, cells };
    }
  }
  return null;
}

/** 二维表格 → 账单行（支付宝 / 微信导出的列名一致度很高）。 */
function billRowsFromMatrix(matrix) {
  const header = findBillHeader(matrix);
  if (!header) {
    return { error: '没认出账单表头，请选择支付宝或微信导出的账单文件（CSV / Excel / 压缩包）。' };
  }
  const columnAt = (...names) => {
    for (const name of names) {
      const at = header.cells.findIndex((cell) => cell === name || cell.startsWith(name));
      if (at >= 0) return at;
    }
    return -1;
  };
  const timeAt = columnAt('交易时间');
  const nameAt = columnAt('交易对方');
  const goodsAt = columnAt('商品说明', '商品');
  const dirAt = columnAt('收/支');
  const amountAt = columnAt('金额');
  const statusAt = columnAt('交易状态', '当前状态');
  if (timeAt < 0 || amountAt < 0) {
    return { error: '账单缺少「交易时间」或「金额」列。' };
  }

  const rows = [];
  let skipped = 0;
  for (let index = header.index + 1; index < matrix.length; index += 1) {
    const cells = matrix[index] ?? [];
    if (!cells.some((cell) => String(cell ?? '').length > 0)) continue;
    const timeCell = cells[timeAt] ?? '';
    let date = null;
    const dateMatch = String(timeCell).match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (dateMatch) {
      date = `${dateMatch[1]}-${pad2(Number(dateMatch[2]))}-${pad2(Number(dateMatch[3]))}`;
    } else {
      date = excelSerialToISODate(timeCell);
    }
    if (!date || !isISODate(date)) {
      skipped += 1;
      continue;
    }
    const status = statusAt >= 0 ? String(cells[statusAt] ?? '') : '';
    if (/关闭|失败|已撤销/.test(status)) {
      skipped += 1;
      continue;
    }
    const amountText = String(cells[amountAt] ?? '').replace(/[¥￥,\s元]/g, '');
    const amount = amountToCents(amountText);
    if (!amount || amount > MAX_AMOUNT_CENTS) {
      skipped += 1;
      continue;
    }
    const direction = dirAt >= 0 ? String(cells[dirAt] ?? '') : '';
    if (/不计收支/.test(direction)) {
      skipped += 1;
      continue;
    }
    const isIncome = /收入/.test(direction) || (!direction && /退款|收款/.test(status));
    const merchant = String(cells[nameAt] ?? '');
    const goods = goodsAt >= 0 ? String(cells[goodsAt] ?? '') : '';
    const name = cleanName(merchant || goods, '');
    if (!name) {
      skipped += 1;
      continue;
    }
    rows.push({
      date,
      amount,
      isIncome,
      name: name.slice(0, 40),
      note: goods && goods !== merchant ? goods.slice(0, 60) : '',
    });
  }
  return { rows, skipped };
}

function parseBillText(text) {
  return billRowsFromMatrix(matrixFromDelimitedText(text));
}

/** 字节 → 文本：BOM / UTF-8 / GBK 依次尝试。 */
function decodeBillText(bytes) {
  if (bytes.length > 1) {
    if (bytes[0] === 0xff && bytes[1] === 0xfe) return new TextDecoder('utf-16le').decode(bytes);
    if (bytes[0] === 0xfe && bytes[1] === 0xff) return new TextDecoder('utf-16be').decode(bytes);
  }
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const broken = (text.match(/\uFFFD/g) ?? []).length;
  if (broken > 0) {
    try {
      const gbk = new TextDecoder('gbk').decode(bytes);
      if ((gbk.match(/\uFFFD/g) ?? []).length < broken) {
        text = gbk.charCodeAt(0) === 0xfeff ? gbk.slice(1) : gbk;
      }
    } catch (error) {
      console.warn('GBK 解码失败', error);
      // Safari 早期版本没有 GBK 解码器：乱码太多时直接提示换 xlsx / UTF-8 CSV
      if (broken > Math.max(2, text.length * 0.01)) throw new Error('NO_GBK');
    }
  }
  return text;
}

/* ---- zip / xlsx ---- */

function zipEntriesFromBytes(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  const floor = Math.max(0, bytes.length - 22 - 65535);
  for (let index = bytes.length - 22; index >= floor; index -= 1) {
    if (view.getUint32(index, true) === 0x06054b50) {
      eocd = index;
      break;
    }
  }
  if (eocd < 0) return null;

  const count = view.getUint16(eocd + 10, true);
  let offset = view.getUint32(eocd + 16, true);
  const entries = [];
  for (let index = 0; index < count; index += 1) {
    if (offset + 46 > bytes.length || view.getUint32(offset, true) !== 0x02014b50) break;
    const entry = {
      flags: view.getUint16(offset + 8, true),
      method: view.getUint16(offset + 10, true),
      crc: view.getUint32(offset + 16, true),
      compSize: view.getUint32(offset + 20, true),
      nameLen: view.getUint16(offset + 28, true),
      extraLen: view.getUint16(offset + 30, true),
      commentLen: view.getUint16(offset + 32, true),
      localOffset: view.getUint32(offset + 42, true),
    };
    entry.name = new TextDecoder('utf-8').decode(
      bytes.subarray(offset + 46, offset + 46 + entry.nameLen),
    );
    entries.push(entry);
    offset += 46 + entry.nameLen + entry.extraLen + entry.commentLen;
  }
  return entries;
}

function zipCryptoDecrypt(bytes, password) {
  const keys = [0x12345678, 0x23456789, 0x34567890];
  const update = (byte) => {
    keys[0] = crc32Step(keys[0], byte);
    keys[1] = (Math.imul((keys[1] + (keys[0] & 0xff)) >>> 0, 134775813) + 1) >>> 0;
    keys[2] = crc32Step(keys[2], (keys[1] >>> 24) & 0xff);
  };
  for (const byte of new TextEncoder().encode(password)) update(byte);
  const output = new Uint8Array(bytes.length);
  for (let index = 0; index < bytes.length; index += 1) {
    const temp = (keys[2] | 2) & 0xffff;
    const keyByte = ((Math.imul(temp, temp ^ 1)) >>> 8) & 0xff;
    const plain = bytes[index] ^ keyByte;
    update(plain);
    output[index] = plain;
  }
  return output;
}

async function inflateRawBytes(data) {
  if (typeof DecompressionStream !== 'function') {
    throw new Error('NO_INFLATE');
  }
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZipEntry(bytes, entry, password) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (view.getUint32(entry.localOffset, true) !== 0x04034b50) throw new Error('BAD_ZIP');
  const nameLen = view.getUint16(entry.localOffset + 26, true);
  const extraLen = view.getUint16(entry.localOffset + 28, true);
  const start = entry.localOffset + 30 + nameLen + extraLen;
  let data = bytes.subarray(start, start + entry.compSize);

  if ((entry.flags & 1) === 1) {
    if (!password) throw new Error('ZIP_PASSWORD');
    data = zipCryptoDecrypt(data, password).subarray(12);
  }
  if (entry.method === 0) {
    if (password && crc32Of(data) !== (entry.crc >>> 0)) throw new Error('ZIP_PASSWORD');
    return data;
  }
  if (entry.method !== 8) throw new Error('ZIP_METHOD');
  try {
    return await inflateRawBytes(data);
  } catch (error) {
    if (password) throw new Error('ZIP_PASSWORD');
    throw error;
  }
}

function parseSharedStrings(xmlText) {
  const document = new DOMParser().parseFromString(xmlText, 'application/xml');
  return [...document.getElementsByTagName('si')].map((item) =>
    [...item.getElementsByTagName('t')].map((node) => node.textContent ?? '').join(''));
}

function columnIndexFromRef(ref) {
  const letters = String(ref ?? '').replace(/[^A-Z]/gi, '').toUpperCase();
  let value = 0;
  for (const letter of letters) value = value * 26 + (letter.charCodeAt(0) - 64);
  return value - 1;
}

function parseXlsxSheet(xmlText, sharedStrings) {
  const document = new DOMParser().parseFromString(xmlText, 'application/xml');
  const matrix = [];
  for (const row of document.getElementsByTagName('row')) {
    const cells = [];
    let fallback = 0;
    for (const cell of row.getElementsByTagName('c')) {
      const at = cell.getAttribute('r') ? columnIndexFromRef(cell.getAttribute('r')) : fallback;
      fallback = at + 1;
      const type = cell.getAttribute('t') ?? '';
      let value = '';
      if (type === 's') {
        const pointer = Number(cell.getElementsByTagName('v')[0]?.textContent ?? '-1');
        value = sharedStrings[pointer] ?? '';
      } else if (type === 'inlineStr') {
        value = cell.getElementsByTagName('t')[0]?.textContent ?? '';
      } else {
        value = cell.getElementsByTagName('v')[0]?.textContent ?? '';
        if (type === 'str') value = String(value);
      }
      cells[at] = value;
    }
    matrix.push(cells);
    if (matrix.length > 30000) break;
  }
  return matrix;
}

async function parseXlsxArchive(bytes, entries, password) {
  const find = (pattern) => entries.find((entry) => pattern.test(entry.name));
  const sheet = find(/^xl\/worksheets\/sheet\d+\.xml$/i);
  if (!sheet) return null;
  const sharedEntry = find(/^xl\/sharedStrings\.xml$/i);
  const shared = sharedEntry ? parseSharedStrings(decodeBillText(await readZipEntry(bytes, sharedEntry, password))) : [];
  const matrix = parseXlsxSheet(decodeBillText(await readZipEntry(bytes, sheet, password)), shared);
  return billRowsFromMatrix(matrix);
}

/** 把用户选中的文件内容解析成账单行；zip / xlsx / csv 都走这里。 */
async function importBillBuffer(buffer, fileName, password) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length < 4) return { error: '文件是空的。' };

  const isZip = bytes[0] === 0x50 && bytes[1] === 0x4b
    && (bytes[2] === 0x03 || bytes[2] === 0x05 || bytes[2] === 0x07);
  if (isZip) {
    const entries = zipEntriesFromBytes(bytes);
    if (!entries || !entries.length) throw new Error('BAD_ZIP');

    const xlsxResult = await parseXlsxArchive(bytes, entries, password);
    if (xlsxResult) return xlsxResult;

    const csvEntry = entries.find((entry) => /\.(csv|txt)$/i.test(entry.name))
      ?? entries.find((entry) => !entry.name.endsWith('/'));
    if (!csvEntry) throw new Error('ZIP_NO_BILL');

    const data = await readZipEntry(bytes, csvEntry, password);
    if (data[0] === 0x50 && data[1] === 0x4b) {
      const inner = zipEntriesFromBytes(data);
      if (inner) {
        const innerXlsx = await parseXlsxArchive(data, inner, password);
        if (innerXlsx) return innerXlsx;
      }
    }
    return billRowsFromMatrix(matrixFromDelimitedText(decodeBillText(data)));
  }

  // 老版 Excel（OLE2 复合文档）
  if (bytes[0] === 0xd0 && bytes[1] === 0xcf && bytes[2] === 0x11 && bytes[3] === 0xe0) {
    throw new Error('XLS_OLD');
  }
  return billRowsFromMatrix(matrixFromDelimitedText(decodeBillText(bytes)));
}

function billErrorMessage(error) {
  const code = error && error.message;
  switch (code) {
    case 'ZIP_PASSWORD': return '压缩包密码不对，或文件已损坏。';
    case 'ZIP_NO_BILL': return '压缩包里没有找到账单文件（CSV / XLSX）。';
    case 'XLS_OLD': return '这是老版 Excel（.xls），请用 Excel / WPS 另存为 .xlsx 或 CSV 再导入。';
    case 'NO_INFLATE': return '当前系统版本不支持直接解压，请先在电脑上解压出 CSV 再导入。';
    case 'BAD_ZIP': return '压缩包读取失败，请确认文件完整。';
    case 'NO_GBK': return '当前浏览器不支持 GBK 解码。请用 Excel / WPS 打开账单，另存为 UTF-8 的 CSV 或 .xlsx 再导入。';
    case 'ZIP_METHOD': return '这个压缩包用了不支持的压缩方式，请先解压出 CSV 再导入。';
    default: return '账单读取失败，请确认是支付宝 / 微信导出的账单文件。';
  }
}

let pendingBill = null;
let billPasswordRequested = false;

function askBillPassword() {
  openSheet(`
    <dialog class="sheet confirm-sheet is-neutral" aria-labelledby="bill-pwd-title">
      <form class="confirm-card" onsubmit="return false">
        <div class="confirm-icon">${iconSvg('shield', { size: 22 })}</div>
        <h2 id="bill-pwd-title">这个压缩包有密码</h2>
        <p>支付宝 / 微信导出的账单压缩包默认加密，密码写在导出时的那条通知或邮件里。</p>
        <label class="field" for="bill-password">
          <span>解压密码</span>
          <input id="bill-password" type="text" autocomplete="off" placeholder="输入密码">
        </label>
        <div class="confirm-actions">
          <button class="btn btn-secondary" type="button" data-action="close-dialog">取消</button>
          <button class="btn btn-primary" type="button" data-action="bill-unlock">解压并导入</button>
        </div>
      </form>
    </dialog>`, { focusSelector: '#bill-password' });
}

function finishBillImport(result) {
  if (!result || result.error) {
    showToast(result?.error ?? '账单读取失败。', { type: 'error', duration: 6000 });
    return;
  }
  if (!result.rows.length) {
    showToast('这份账单里没有可以导入的记录。', { type: 'error', duration: 5000 });
    return;
  }
  const incomeCount = result.rows.filter((row) => row.isIncome).length;
  askConfirm({
    variant: 'neutral',
    title: `导入 ${result.rows.length} 笔账单？`,
    message: `其中支出 ${result.rows.length - incomeCount} 笔、收入 ${incomeCount} 笔。重复的记录会自动跳过，导入后仍可在账本里修改。`,
    confirmLabel: '开始导入',
    onConfirm: () => applyBillRows(result.rows),
  });
}

async function readBillFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  input.value = '';
  if (file.size > 20 * 1024 * 1024) {
    showToast('文件太大了，请选择 20 MB 以内的账单。', { type: 'error' });
    return;
  }
  pendingBill = null;
  billPasswordRequested = false;
  try {
    const buffer = await file.arrayBuffer();
    const result = await importBillBuffer(buffer, file.name, '');
    finishBillImport(result);
  } catch (error) {
    if (error && error.message === 'ZIP_PASSWORD') {
      pendingBill = { buffer: await file.arrayBuffer(), name: file.name };
      billPasswordRequested = true;
      askBillPassword();
      return;
    }
    console.error('账单读取失败', error);
    showToast(billErrorMessage(error), { type: 'error', duration: 6000 });
  }
}

async function unlockBillArchive() {
  const field = document.getElementById('bill-password');
  const password = String(field?.value ?? '').trim();
  if (!password) {
    showToast('请输入压缩包密码。', { type: 'error' });
    field?.focus();
    return;
  }
  if (!pendingBill) {
    showToast('文件已失效，请重新选择一次。', { type: 'error' });
    closeSheet();
    return;
  }
  const job = pendingBill;
  closeSheet();
  showToast('正在解压…', { type: 'info', duration: 1800 });
  try {
    const result = await importBillBuffer(job.buffer, job.name, password);
    pendingBill = null;
    finishBillImport(result);
  } catch (error) {
    if (error && error.message === 'ZIP_PASSWORD') {
      pendingBill = job;
      showToast('密码不对，再试一次。', { type: 'error' });
      askBillPassword();
      return;
    }
    console.error('解压失败', error);
    showToast(billErrorMessage(error), { type: 'error', duration: 6000 });
  }
}

function applyBillRows(rows) {
  ensureAutoStore();
  const keyOf = (date, amount, name) => `${date}|${amount}|${name}`;
  const seen = new Set();
  for (const record of store.records) seen.add(keyOf(record.date, record.amount, record.name));
  for (const income of store.incomes) seen.add(keyOf(income.date, income.amount, income.name));

  const now = new Date().toISOString();
  let expenses = 0;
  let incomes = 0;
  let duplicates = 0;
  for (const row of rows) {
    const key = keyOf(row.date, row.amount, row.name);
    if (seen.has(key)) {
      duplicates += 1;
      continue;
    }
    seen.add(key);
    if (row.isIncome) {
      store.incomes.unshift({
        id: uid('inc'),
        amount: row.amount,
        name: row.name,
        source: 'import',
        date: row.date,
        capturedAt: now,
        text: row.note,
      });
      incomes += 1;
    } else {
      store.records.push({
        id: uid('rec'),
        name: row.name,
        amount: row.amount,
        categoryId: autoPickCategory(`${row.name} ${row.note}`),
        date: row.date,
        note: row.note ? `账单导入 · ${row.note}` : '账单导入',
        createdAt: now,
        updatedAt: now,
        source: 'import',
      });
      expenses += 1;
    }
  }
  while (store.incomes.length > 600) store.incomes.pop();
  saveStore();
  render();
  showToast(
    `导入完成：支出 ${expenses} 笔、收入 ${incomes} 笔${duplicates ? `，跳过重复 ${duplicates} 笔` : ''}`,
    { duration: 5600 },
  );
}

function autoImportBill() {
  const input = document.getElementById('bill-file');
  if (!input) return;
  input.click();
}

function openSheet(markup, { focusSelector = '', selectText = false } = {}) {
  modalToken += 1;
  const token = modalToken;

  for (const oldDialog of modalRoot.querySelectorAll('dialog[open]')) {
    try {
      oldDialog.close();
    } catch {
      // 已经关闭的对话框无需处理。
    }
  }

  modalRoot.innerHTML = markup;
  const dialog = modalRoot.querySelector('dialog');
  if (!dialog) return null;

  dialog.showModal();
  document.body.classList.add('is-locked');

  dialog.addEventListener('close', () => {
    if (token !== modalToken) return;
    modalRoot.innerHTML = '';
    document.body.classList.remove('is-locked');
    pendingConfirm = null;
  });

  dialog.addEventListener('click', (event) => {
    if (event.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    const outside = event.clientX < rect.left
      || event.clientX > rect.right
      || event.clientY < rect.top
      || event.clientY > rect.bottom;
    if (outside) dialog.close();
  });

  if (focusSelector) {
    requestAnimationFrame(() => {
      const field = dialog.querySelector(focusSelector);
      if (field) {
        field.focus({ preventScroll: true });
        if (selectText && typeof field.select === 'function') field.select();
      }
    });
  }

  return dialog;
}

function closeSheet() {
  const dialog = modalRoot.querySelector('dialog[open]');
  if (dialog) dialog.close();
}

function showFormError(form, message) {
  const box = form.querySelector('.form-error');
  if (!box) return;
  box.hidden = false;
  const text = box.querySelector('.form-error-text');

}

function handleRecordSubmit(form) {
  hideFormError(form);
  const data = new FormData(form);
  const amount = amountToCents(data.get('amount'));
  const name = String(data.get('name') ?? '').trim();
  const date = String(data.get('date') ?? '');
  const categoryId = String(data.get('categoryId') ?? '');
  const note = String(data.get('note') ?? '').trim();
  const recordId = String(data.get('recordId') ?? '');

  if (!amount) {
    showFormError(form, '请输入大于 0 的金额，最多保留两位小数。');
    form.querySelector('#record-amount')?.focus();
    return;
  }
  if (!name) {
    showFormError(form, '给这笔支出起个名称吧。');
    form.querySelector('#record-name')?.focus();
    return;
  }
  if (!isISODate(date) || date > todayISO()) {
    showFormError(form, '请选择一个今天或更早的有效日期。');
    form.querySelector('#record-date')?.focus();
    return;
  }
  if (!findCategory(store.categories, categoryId)) {
    showFormError(form, '这个分类已经不存在，请重新选择一个分类。');
    return;
  }

  const now = new Date().toISOString();
  if (recordId) {
    const index = store.records.findIndex((item) => item.id === recordId);
    if (index === -1) {
      showFormError(form, '找不到这笔记录，它可能已经被删除。');
      return;
    }
    store.records[index] = {
      ...store.records[index],
      name,
      amount,
      categoryId,
      date,
      note,
      updatedAt: now,
    };
  } else {
    store.records.push({
      id: uid('rec'),
      name,
      amount,
      categoryId,
      date,
      note,
      createdAt: now,
      updatedAt: now,
    });
  }

  saveStore();
  closeSheet();

  if (route === 'records') {
    ui.ledger.month = monthKey(date);
    ui.ledger.day = null;
    ui.ledger.categoryId = 'all';
    ui.ledger.query = '';
  }
  if (route === 'stats') {
    ui.statsMonth = monthKey(date);
  }

  render();
  showToast(recordId ? '这笔记录已更新。' : `已记下 ${name} · ${formatMoney(amount)}`);
}

  const iconChoices = CATEGORY_ICONS.map((icon) => `
    <input type="radio" name="icon" id="icon-${icon}" value="${icon}" aria-label="${escapeHTML(ICON_LABELS[icon] || '分类图标')}" ${icon === selectedIcon ? 'checked' : ''}>
    <label class="icon-choice" for="icon-${icon}" title="${escapeHTML(ICON_LABELS[icon] || icon)}">${iconSvg(icon, { size: 19 })}</label>`).join('');

  const colorChoices = COLOR_PALETTE.map((color, index) => `
    <input type="radio" name="color" id="color-${index}" value="${color}" aria-label="颜色 ${color}" ${color.toUpperCase() === selectedColor.toUpperCase() ? 'checked' : ''}>
    <label class="color-choice" for="color-${index}" style="--swatch:${color}" title="${color}"></label>`).join('');

  openSheet(`
    <dialog class="sheet" aria-labelledby="category-dialog-title">
      <form class="sheet-form" id="category-form" novalidate>
        <input type="hidden" name="categoryId" value="${isEdit ? escapeHTML(category.id) : ''}">
        <div class="sheet-head">
          <div class="sheet-head-copy">
            <div class="sheet-kicker">分类</div>
            <h2 id="category-dialog-title">${isEdit ? '编辑分类' : '新建一个分类'}</h2>
            <p>用顺手的名字和颜色，把同类支出放在一起。</p>
          </div>
          <button class="sheet-close" type="button" data-action="close-dialog" aria-label="关闭">
            ${iconSvg('close', { size: 16 })}
          </button>
        </div>

        <div class="sheet-body">
          <div class="category-form-preview">
            <span class="category-icon" id="category-preview-icon" style="--cat:${selectedColor}">
              ${iconSvg(selectedIcon, { size: 21 })}
            </span>
            <div>
              <strong id="category-preview-name">${escapeHTML(name || '新分类')}</strong>
              <p>保存后会出现在记账的分类里</p>
            </div>
          </div>

          <div class="form-error" hidden>
            ${iconSvg('alert', { size: 14 })}<span class="form-error-text"></span>
          </div>

          <label class="field" for="category-name">
            <span>分类名称</span>
            <input id="category-name" name="name" type="text" maxlength="12" required
              value="${escapeHTML(name)}" placeholder="例如：宠物、咖啡、旅行" autocomplete="off">
          </label>

          <fieldset class="field">
            <legend>图标</legend>
            <div class="icon-picker">${iconChoices}</div>
          </fieldset>

          <fieldset class="field">
            <legend>颜色</legend>
            <div class="color-picker">${colorChoices}</div>
          </fieldset>
        </div>

        <div class="sheet-foot">
          <span class="sheet-foot-spacer"></span>
          <button class="btn btn-secondary" type="button" data-action="close-dialog">取消</button>
          <button class="btn btn-primary" type="submit">${isEdit ? '保存分类' : '添加分类'}</button>
        </div>
      </form>
    </dialog>`, { focusSelector: '#category-name' });
}

function updateCategoryPreview(form) {
  if (!form || form.id !== 'category-form') return;
  const nameInput = form.querySelector('#category-name');
  const iconInput = form.querySelector('input[name="icon"]:checked');
  const colorInput = form.querySelector('input[name="color"]:checked');
  const previewIcon = form.querySelector('#category-preview-icon');
  const previewName = form.querySelector('#category-preview-name');
  if (!previewIcon || !previewName) return;

  const icon = iconInput?.value || 'tag';
  const color = colorInput?.value || COLOR_PALETTE[0];
  previewIcon.style.setProperty('--cat', color);
  previewIcon.innerHTML = iconSvg(icon, { size: 21 });
  previewName.textContent = nameInput?.value.trim() || '新分类';
}

function handleCategorySubmit(form) {
  hideFormError(form);
  const data = new FormData(form);
  const categoryId = String(data.get('categoryId') ?? '');
  const name = String(data.get('name') ?? '').replace(/\s+/g, ' ').trim().slice(0, 12);
  const icon = String(data.get('icon') ?? 'tag');
  const color = String(data.get('color') ?? COLOR_PALETTE[0]);

  if (!name) {
    showFormError(form, '给分类取一个名字吧。');
    form.querySelector('#category-name')?.focus();
    return;
  }
  if (!CATEGORY_ICONS.includes(icon)) {
    showFormError(form, '请选择一个图标。');
    return;
  }
  if (!/^#[0-9a-fA-F]{6}$/.test(color)) {
    showFormError(form, '请选择一个颜色。');
    return;
  }
  const duplicate = store.categories.some((category) => (
    category.id !== categoryId
    && category.name.toLocaleLowerCase('zh-CN') === name.toLocaleLowerCase('zh-CN')
  ));
  if (duplicate) {
    showFormError(form, '已经有同名分类了，换一个名字吧。');
    form.querySelector('#category-name')?.focus();
    return;
  }

  if (categoryId) {
    const category = findCategory(store.categories, categoryId);
    if (!category) {
      showFormError(form, '找不到这个分类，它可能已经被删除。');
      return;
    }
    category.name = name;
    category.icon = icon;
    category.color = color;
  } else {
    store.categories.push({ id: uid('cat'), name, icon, color });
  }

  saveStore();
  closeSheet();
  render();
  showToast(categoryId ? '分类已更新。' : `分类「${name}」已添加。`);
}

function markQuickCategoryActive(form, categoryId) {
  form.querySelector('input[name="categoryId"]').value = categoryId;
  for (const choice of form.querySelectorAll('.category-choice')) {
    const active = choice.dataset.categoryId === categoryId;
    choice.classList.toggle('is-selected', active);
    choice.setAttribute('aria-pressed', String(active));
  }
}

function quickCreateCategory() {
  const form = document.getElementById('record-form');
  if (!form) return;
  const input = form.querySelector('#quick-category-name');
  const block = form.querySelector('#quick-category-form');
  const name = input?.value.replace(/\s+/g, ' ').trim().slice(0, 12) ?? '';

  if (!name) {
    showToast('先给新分类取个名字。', { type: 'error' });
    input?.focus();
    return;
  }
  if (store.categories.some((category) => category.name.toLocaleLowerCase('zh-CN') === name.toLocaleLowerCase('zh-CN'))) {
    showToast('已经有同名分类了，换一个名字吧。', { type: 'error' });
    input?.focus();
    input?.select();
    return;
  }

  const category = {
    id: uid('cat'),
    name,
    icon: 'tag',
    color: COLOR_PALETTE[store.categories.length % COLOR_PALETTE.length],
  };
  store.categories.push(category);
  saveStore();

  const picker = form.querySelector('#category-options');
  picker.innerHTML = categoryChoicesMarkup(category.id);
  markQuickCategoryActive(form, category.id);
  if (input) input.value = '';
  if (block) block.hidden = true;
  showToast(`分类「${name}」已添加，并选中了它。`);
}

function askConfirm({ title, message, confirmLabel = '确认', onConfirm, variant = 'danger' }) {
  pendingConfirm = onConfirm;
  openSheet(`
    <dialog class="sheet confirm-sheet ${variant === 'danger' ? '' : 'is-neutral'}" aria-labelledby="confirm-title">
      <div class="confirm-card">
        <div class="confirm-icon">${iconSvg(variant === 'danger' ? 'alert' : 'info', { size: 22 })}</div>
        <h2 id="confirm-title">${escapeHTML(title)}</h2>
        <p>${escapeHTML(message)}</p>
        <div class="confirm-actions">
          <button class="btn btn-secondary" type="button" data-action="close-dialog">取消</button>
          <button class="btn ${variant === 'danger' ? 'btn-danger' : 'btn-primary'}" type="button" data-action="confirm-accept">
            ${escapeHTML(confirmLabel)}
          </button>
        </div>
      </div>
    </dialog>`, { focusSelector: '[data-action="close-dialog"]' });
}

function showToast(message, { type = 'success', duration = 3400 } = {}) {
  while (toastRoot.children.length >= 3) toastRoot.firstElementChild?.remove();
  const toast = document.createElement('div');
  toast.className = `toast ${type === 'error' ? 'is-error' : ''}`;
  toast.innerHTML = `<span class="toast-icon">${iconSvg(type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check', { size: 12 })}</span><span class="toast-text"></span>`;
  toast.querySelector('.toast-text').textContent = message;
  toastRoot.appendChild(toast);

  try {
    if (typeof toastRoot.showPopover === 'function' && !toastRoot.matches(':popover-open')) {
      toastRoot.showPopover();
    }
  } catch {
    // 不支持 Popover 的浏览器会在普通层级显示提示。
  }

  window.setTimeout(() => {
    toast.classList.add('is-leaving');
    window.setTimeout(() => {
      toast.remove();
      if (!toastRoot.children.length) {
        try {
          toastRoot.hidePopover();
        } catch {
          // 已经是关闭状态。
        }
      }
    }, 240);
  }, duration);
}

function stringToBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  const chunkSize = 0x8000;
  for (let index = 0; index < bytes.length; index += chunkSize) {
    binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
  }
  return btoa(binary);
}

function androidSaveAvailable() {
  return Boolean(window.XiaomanAndroid && typeof window.XiaomanAndroid.saveFile === 'function');
}

function downloadFile(filename, content, mimeType) {
  if (androidSaveAvailable()) {
    try {
      window.XiaomanAndroid.saveFile(filename, mimeType, stringToBase64(content));
      return;
    } catch (error) {
      console.warn('Android 保存接口不可用，尝试浏览器下载。', error);
    }
  }

  // iOS：优先走系统分享面板，可以直接存进「文件」App
  if (isIOS() && typeof navigator.share === 'function') {
    void shareFileFallback(filename, content, mimeType).then((shared) => {
      if (!shared) downloadViaBlob(filename, content, mimeType);
    });
    return;
  }

  downloadViaBlob(filename, content, mimeType);
}

function downloadViaBlob(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1200);
}

function exportJSON() {
  const payload = JSON.stringify(backupPayload(store), null, 2);
  const native = androidSaveAvailable();
  downloadFile(`小满账本备份-${todayISO()}.json`, payload, 'application/json;charset=utf-8');
  if (native) {
    showToast('请在系统窗口中选择备份保存位置。', { type: 'info', duration: 4200 });
  } else {
    showToast(store.records.length ? '备份已导出，请妥善保存。' : '已导出空白账本备份。');
  }
}

function exportCSV() {
  const content = `\uFEFF${recordsToCSV(store.records, store.categories)}`;
  const native = androidSaveAvailable();
  downloadFile(`小满账本流水-${todayISO()}.csv`, content, 'text/csv;charset=utf-8');
  if (native) {
    showToast('请在系统窗口中选择表格保存位置。', { type: 'info', duration: 4200 });
  } else {
    showToast(store.records.length ? '表格已导出，可用 Excel 打开。' : '已导出空白流水表格。');
  }
}

async function handleImportFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  input.value = '';
  if (file.size > 10 * 1024 * 1024) {
    showToast('文件太大了，请选择 10 MB 以内的备份。', { type: 'error' });
    return;
  }

  try {
    const raw = JSON.parse(await file.text());
    const result = validateBackup(raw);
    if (!result.ok) {
      showToast(result.error, { type: 'error', duration: 5000 });
      return;
    }
    askConfirm({
      title: '用备份替换当前账本？',
      message: `这份备份包含 ${result.store.records.length} 笔流水和 ${result.store.categories.length} 个分类。导入后，本机现有的全部流水和自定义分类都会被替换。`,
      confirmLabel: '导入备份',
      onConfirm: () => {
        store = result.store;
        saveStore();
        ui.ledger = { month: currentMonthKey(), categoryId: 'all', query: '', day: null };
        ui.statsMonth = currentMonthKey();
        render();
        showToast(result.warnings || '备份已导入。', { type: result.warnings ? 'info' : 'success', duration: 5000 });
      },
    });
  } catch (error) {
    console.error('导入失败', error);
    showToast('备份文件无法读取，请确认它是本应用导出的 JSON 文件。', { type: 'error', duration: 5000 });
  }
}

function requestClearData() {
  askConfirm({
    title: '清空全部账本数据？',
    message: '本机上的全部流水和自定义分类都会被删除，无法恢复。建议先导出一份备份。',
    confirmLabel: '清空数据',
    onConfirm: () => {
      store = createDefaultStore();
      saveStore();
      ui.ledger = { month: currentMonthKey(), categoryId: 'all', query: '', day: null };
      ui.statsMonth = currentMonthKey();
      render();
      showToast('账本已清空，一切重新开始。');
    },
  });
}

function requestDeleteRecord(recordId) {
  const record = store.records.find((item) => item.id === recordId);
  if (!record) {
    showToast('找不到这笔记录。', { type: 'error' });
    return;
  }
  closeSheet();
  queueMicrotask(() => {
    askConfirm({
      title: '删除这笔记录？',
      message: `${dateLabel(record.date)} · ${record.name}\n${formatMoney(record.amount)}，删除后无法恢复。`,
      confirmLabel: '删除记录',
      onConfirm: () => {
        store.records = store.records.filter((item) => item.id !== recordId);
        saveStore();
        render();
        showToast('这笔记录已删除。');
      },
    });
  });
}

function requestDeleteCategory(categoryId) {
  const category = findCategory(store.categories, categoryId);
  if (!category) {
    showToast('找不到这个分类。', { type: 'error' });
    return;
  }
  const count = store.records.filter((record) => record.categoryId === categoryId).length;
  if (count > 0) {
    showToast(`「${category.name}」里还有 ${count} 笔记录。先从这些记录里换一个分类，再删除它吧。`, {
      type: 'error',
      duration: 5200,
    });
    return;
  }
  if (store.categories.length <= 1) {
    showToast('至少要保留一个分类。', { type: 'error' });
    return;
  }
  askConfirm({
    title: `删除分类「${category.name}」？`,
    message: '这个分类目前没有关联的流水。删除后，它的图标和颜色设置也会一起消失。',
    confirmLabel: '删除分类',
    onConfirm: () => {
      store.categories = store.categories.filter((item) => item.id !== categoryId);
      saveStore();
      render();
      showToast('分类已删除。');
    },
  });
}

async function installApp() {
  if (isIOS()) {
    showToast(IOS_INSTALL_HINT, { type: 'info', duration: 7200 });
    return;
  }
  if (!deferredInstallPrompt) {
    showToast('请在浏览器菜单中选择“安装小满账本”或“添加到主屏幕”。', { type: 'info', duration: 5200 });
    return;
  }
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if (choice.outcome === 'accepted') showToast('小满账本已安装到桌面。');
}

function render() {
  const renderers = {
    overview: renderOverviewView,
    records: renderLedgerView,
    stats: renderStatsView,
    categories: renderCategoryView,
    auto: renderAutoView,
  };
  const titleMap = {
    overview: '总览',
    records: '流水',
    stats: '统计',
    categories: '分类',
    auto: '自动记账',
  };
  viewRoot.innerHTML = `<div class="view" data-view="${route}">${renderers[route]()}</div>`;
  document.title = `${titleMap[route]} · 小满账本`;
  syncNavigation();
}

function syncNavigation() {
  for (const link of document.querySelectorAll('[data-route]')) {
    const active = link.dataset.route === route;
    link.classList.toggle('active', active);
    if (active) {
      link.setAttribute('aria-current', 'page');
    } else {
      link.removeAttribute('aria-current');
    }
  }
}

function navigate(nextRoute) {
  if (!ROUTES.has(nextRoute)) return;
  if (location.hash === `#${nextRoute}`) {
    route = nextRoute;
    render();
    window.scrollTo(0, 0);
    return;
  }
  location.hash = nextRoute;
}

/* 交互                                                               */
/* ------------------------------------------------------------------ */

function setAnotherMonth(scope, delta) {
  const current = scope === 'stats' ? ui.statsMonth : ui.ledger.month;
  let next = shiftMonth(current, delta);
  if (next > currentMonthKey()) next = currentMonthKey();
  if (scope === 'stats') {
    ui.statsMonth = next;
  } else {
    ui.ledger.month = next;
    ui.ledger.day = null;
  }
  render();
}

function resetLedgerFilters() {
  ui.ledger.categoryId = 'all';
  ui.ledger.query = '';
  ui.ledger.day = null;
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case 'goto-auto': {
      navigate('auto');
      break;
    }
    case 'auto-toggle': {
      autoToggleSetting(target.dataset.key);
      break;
    }
    case 'auto-open-settings': {
      autoOpenAccessSettings();
      break;
    }
    case 'auto-check-access': {
      const granted = autoAccessGranted();
      syncAutoRecords({ silent: true });
      render();
      showToast(
        granted ? '通知使用权已开启。' : '还没开启：请到系统设置的「通知使用权」里打开小满账本。',
        { type: granted ? 'success' : 'info', duration: granted ? 3200 : 6200 },
      );
      break;
    }
    case 'auto-confirm': {
      autoConfirmPending(target.dataset.id);
      break;
    }
    case 'auto-confirm-all': {
      autoConfirmAllPending();
      break;
    }
    case 'auto-drop': {
      autoDropPending(target.dataset.id);
      break;
    }
    case 'auto-add-rule': {
      autoAddRule();
      break;
    }
    case 'auto-delete-rule': {
      autoDeleteRule(target.dataset.id);
      break;
    }
    case 'auto-delete-income': {
      autoDeleteIncome(target.dataset.id);
      break;
    }
    case 'auto-import-bill': {
      autoImportBill();
      break;
    }
    case 'bill-unlock': {
      unlockBillArchive();
      break;
    }
    case 'open-add': {
      const categoryId = target.dataset.categoryId || '';
      const date = target.dataset.date || '';
      openRecordDialog(null, { categoryId, date });
      break;
    }
    case 'edit-record': {
      const record = store.records.find((item) => item.id === target.dataset.id);
      if (record) openRecordDialog(record);
      break;
    }
    case 'pick-category': {
      const form = target.closest('form');
      if (!form) break;
      markQuickCategoryActive(form, target.dataset.categoryId);
      break;
    }
    case 'toggle-quick-category': {
      const form = target.closest('form');
      const block = form?.querySelector('#quick-category-form');
      if (!block) break;
      block.hidden = !block.hidden;
      if (!block.hidden) block.querySelector('input')?.focus();
      break;
    }
    case 'quick-create-category':
      quickCreateCategory();
      break;
    case 'month-shift':
      setAnotherMonth(target.dataset.scope, Number(target.dataset.delta));
      break;
    case 'month-current': {
      const scope = target.dataset.scope;
      if (scope === 'stats') {
        ui.statsMonth = currentMonthKey();
      } else {
        ui.ledger.month = currentMonthKey();
        ui.ledger.day = null;
      }
      render();
      break;
    }
    case 'stats-day': {
      const date = target.dataset.date;
      if (!date) break;
      ui.ledger.month = monthKey(date);
      ui.ledger.categoryId = 'all';
      ui.ledger.query = '';
      ui.ledger.day = date;
      navigate('records');
      break;
    }
    case 'filter-category': {
      ui.ledger.categoryId = target.dataset.categoryId || 'all';
      render();
      break;
    }
    case 'clear-day':
      ui.ledger.day = null;
      render();
      break;
    case 'clear-filters':
      resetLedgerFilters();
      render();
      break;
    case 'search-clear': {
      ui.ledger.query = '';
      render();
      requestAnimationFrame(() => document.getElementById('ledger-search')?.focus());
      break;
    }
    case 'open-category-add':
      openCategoryDialog();
      break;
    case 'edit-category': {
      const category = findCategory(store.categories, target.dataset.id);
      if (category) openCategoryDialog(category);
      break;
    }
    case 'delete-category':
      requestDeleteCategory(target.dataset.id);
      break;
    case 'request-delete-record':
      requestDeleteRecord(target.dataset.id);
      break;
    case 'close-dialog':
      closeSheet();
      break;
    case 'confirm-accept': {
      const callback = pendingConfirm;
      pendingConfirm = null;
      closeSheet();
      if (typeof callback === 'function') {
        queueMicrotask(() => {
          try {
            callback();
          } catch (error) {
            console.error(error);
            showToast('操作没有完成，请再试一次。', { type: 'error' });
          }
        });
      }
      break;
    }
    case 'export-json':
      exportJSON();
      break;
    case 'export-csv':
      exportCSV();
      break;
    case 'import-trigger':
      document.getElementById('import-file')?.click();
      break;
    case 'clear-data':
      requestClearData();
      break;
    case 'install-app':
      void installApp();
      break;
    default:
      break;
  }
});

document.addEventListener('input', (event) => {
  const target = event.target;

  if (target.id === 'ledger-search') {
    ui.ledger.query = target.value;
    renderLedgerResults();
    return;
  }

  if (target.id === 'record-amount') {
    let value = target.value.replace(/[^\d.]/g, '');
    const dotIndex = value.indexOf('.');
    if (dotIndex >= 0) {
      const whole = value.slice(0, dotIndex).slice(0, 9) || '0';
      const fraction = value.slice(dotIndex + 1).replace(/\./g, '').slice(0, 2);
      value = `${whole}.${fraction}`;
    } else {
      value = value.slice(0, 9);
    }
    target.value = value;
    return;
  }

  if (target.id === 'category-name') {
    updateCategoryPreview(target.closest('form'));
  }
});

document.addEventListener('change', (event) => {
  const target = event.target;
  if (target.id === 'import-file') {
    void handleImportFile(target);
    return;
  }
  if (target.closest('#category-form') && (target.name === 'icon' || target.name === 'color')) {
    updateCategoryPreview(target.closest('form'));
  }
});

document.addEventListener('submit', (event) => {
  const form = event.target;
  if (form.id === 'record-form') {
    event.preventDefault();
    handleRecordSubmit(form);
  } else if (form.id === 'category-form') {
    event.preventDefault();
    handleCategorySubmit(form);
  }
});

document.addEventListener('keydown', (event) => {
  const target = event.target;
  const isTyping = target instanceof HTMLElement
    && (target.matches('input, textarea, select') || target.isContentEditable);
  const dialogOpen = Boolean(modalRoot.querySelector('dialog[open]'));

  if (dialogOpen && (event.ctrlKey || event.metaKey) && event.key === 'Enter') {
    const form = document.getElementById('record-form');
    if (form) {
      event.preventDefault();
      form.requestSubmit();
    }
    return;
  }

  if (dialogOpen) return;

  if (!isTyping && !event.ctrlKey && !event.metaKey && !event.altKey && event.key.toLowerCase() === 'n') {
    event.preventDefault();
    openRecordDialog();
  }
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter' || event.target.id !== 'quick-category-name') return;
  event.preventDefault();
  quickCreateCategory();
});

document.addEventListener('change', (event) => {
  const target = event.target;
  if (target instanceof HTMLSelectElement && target.dataset.action === 'auto-category') {
    autoUpdatePendingCategory(target.dataset.id, target.value);
    return;
  }
  if (target instanceof HTMLInputElement && target.id === 'bill-file') {
    readBillFile(target);
  }
});

window.addEventListener('hashchange', () => {
  route = routeFromHash();
  render();
  window.scrollTo(0, 0);
});

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  showToast('小满账本已安装到桌面。');
});

/* ------------------------------------------------------------------ */
/* 启动                                                               */
/* ------------------------------------------------------------------ */

for (const node of document.querySelectorAll('[data-icon]')) {
  node.innerHTML = iconSvg(node.dataset.icon, {
    size: Number(node.dataset.iconSize) || 20,
  });
}

ensureAutoStore();

if (!document.getElementById('bill-file')) {
  const billInput = document.createElement('input');
  billInput.type = 'file';
  billInput.id = 'bill-file';
  billInput.accept = '.csv,.xlsx,.xls,.zip,.txt,text/csv,text/plain';
  billInput.hidden = true;
  document.body.appendChild(billInput);
}

render();
syncAutoRecords({ silent: true });
startAutoSync();

window.setInterval(() => {
  const day = todayISO();
  if (day === ui.activeDay) return;
  ui.activeDay = day;
  if (!modalRoot.querySelector('dialog[open]')) render();
}, 60_000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  syncAutoRecords({ silent: true });
  if (route === 'auto') render();
  const day = todayISO();
  if (day === ui.activeDay) return;
  ui.activeDay = day;
  if (!modalRoot.querySelector('dialog[open]')) render();
});

if (storageLoadWarning) {
  window.setTimeout(() => showToast(storageLoadWarning, { type: 'error', duration: 6000 }), 400);
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !androidSaveAvailable()) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((error) => {
      console.warn('Service Worker 注册失败', error);
    });
  });
}

})();
</script>
</body>
</html>
